name: "Paths Gate"
description: "Decide whether a triggering change is entirely covered by paths-ignore globs, so the Required PR Check can green-light docs-only PRs without skipping the workflow at the trigger level."
inputs:
  paths_ignore:
    description: "Multiline list of GitHub paths-ignore-style globs. A change is `docs_only` only when every changed file matches at least one of these patterns. Empty (or all-blank) opts out — the action emits `docs_only=false` without an API round-trip."
    required: false
    default: ""
  github-token:
    description: "Token for GitHub REST API calls (defaults to github.token)."
    required: false
    default: ${{ github.token }}
outputs:
  docs_only:
    description: "true if every changed file matched a paths_ignore glob; false otherwise. A push to a feature branch is diffed against the branch its PR targets (next, hotfixes or the default branch), so the first push of a new branch is gated like any other. `false` (with a `::notice::`) when a diff was expected but can't be trusted — zero/missing `before` on an integration-branch push, a compare listing 300 files (the API cap), a failed compare (e.g. `404 No common ancestor`), or a `before` that isn't an ancestor of the pushed commit. Empty string when the event has no diff context (workflow_dispatch / schedule)."
runs:
  using: "node24"
  main: "action.mjs"
