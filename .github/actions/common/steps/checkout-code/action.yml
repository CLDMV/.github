name: "Checkout Code"
description: "Checkout repository code with configurable fetch depth and ref"

inputs:
  token:
    description: "Token to check out with and (when persist-credentials is true) to persist for later git pushes. Empty (default) = the workflow GITHUB_TOKEN. Pass a GitHub App token when a later step pushes tags or branches: the persisted GITHUB_TOKEN can never hold the `workflows` scope, so GitHub refuses a push whose commit's .github/workflows differ from the tip (CLDMV/.github#362)."
    required: false
    default: ""
  fetch-depth:
    description: "Number of commits to fetch. 0 indicates all history for all branches and tags"
    required: false
    default: "1"
  ref:
    description: "The branch, tag, or SHA to checkout. Empty (default) uses the workflow's triggering ref."
    required: false
    default: ""
  persist-credentials:
    description: "Whether actions/checkout leaves the GITHUB_TOKEN persisted as an http.extraheader credential after checkout. Default 'true' (back-compat). Set 'false' when a later step pushes with a DIFFERENT token (e.g. a GitHub App token) via an x-access-token remote URL: a persisted default-token extraheader overrides the URL credential, so the push authenticates as the default GITHUB_TOKEN, which does not trigger on:push workflows (issue #269)."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
        persist-credentials: ${{ inputs.persist-credentials }}
        token: ${{ inputs.token || github.token }}
