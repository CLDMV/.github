name: "Setup Node.js"
description: "Setup Node.js with specified version"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "lts/*"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    # Enable the corepack shims (no third-party action) so a pnpm/yarn repo's
    # run-blocks resolve `pnpm`/`yarn` on this step's Node. Node 25+ doesn't
    # bundle corepack, so the script installs it from npm first. Harmless for npm
    # repos. Best-effort: a failure warns and must not abort setup.
    - name: Enable corepack
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../npm/utilities/corepack/enable.mjs"
