name: "Commit Subjects"
description: "Fail a feature PR whose commit subjects aren't conventional. The release bump reads every subject in the range, so a subject like `agent add: …` changes the version."
inputs:
  github-token:
    description: "Token for GitHub REST API calls (defaults to github.token)."
    required: false
    default: ${{ github.token }}
outputs:
  ok:
    description: "`false` when at least one commit has a non-conventional subject, `true` when every subject passes, empty when nothing was checked (an integration-branch push, a release PR, a branch with no PR target, workflow_dispatch / schedule, or a range the API couldn't list)."
runs:
  using: "node24"
  main: "action.mjs"
