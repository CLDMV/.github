name: "Update Package Version"
description: "Update package.json version using the appropriate package manager"

inputs:
  new-version:
    description: "New version to set"
    required: true
  package-manager:
    description: "Package manager: auto (default, detect), or explicit npm | yarn | pnpm"
    required: false
    default: "auto"

runs:
  using: "node24"
  main: "action.mjs"
