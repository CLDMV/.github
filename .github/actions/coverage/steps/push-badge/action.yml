name: "Push Coverage Badge"
description: "Commit and push badge.json (and optionally the coverage index) to the badges branch, creating it as an orphan if needed"

inputs:
  badges-branch:
    description: "Branch the badge JSON is published to"
    required: false
    default: "badges"
  badge-filename:
    description: "Filename for the badge JSON on the badges branch"
    required: false
    default: "coverage.json"
  index-path:
    description: "Repo-relative path of a coverage index to publish next to the badge (e.g. coverage/coverage-index.json). Empty = badge only. A path that doesn't exist is skipped silently."
    required: false
    default: ""
  index-filename:
    description: "Filename for the coverage index on the badges branch (bare filename, must differ from badge-filename)"
    required: false
    default: "coverage-index.json"
  tests-failed:
    description: "\"true\" publishes a `tests failing` badge (no percentage, red) in place of the computed one, plus the coverage index as usual. The coverage workflow passes true when the tests failed: a failing run's number isn't accurate and the last good number would be stale (CLDMV/.github#565). The next passing run publishes a number again."
    required: false
    default: "false"
  publish-badge:
    description: "\"false\" publishes only the coverage index and leaves the badge as it is. Nothing to publish (no index) exits quietly. The coverage workflow doesn't use it any more; tests-failed covers a failed run."
    required: false
    default: "true"
  bot-name:
    description: "Git committer name"
    required: true
  bot-email:
    description: "Git committer email"
    required: true
  bot-token:
    description: "Token used to push (overridden by the BOT_TOKEN env var if set)"
    required: false
    default: ""
  repository:
    description: "owner/repo of the repository"
    required: true

runs:
  using: "node24"
  main: "action.mjs"
