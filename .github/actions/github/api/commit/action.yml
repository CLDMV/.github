name: "Create Signed Commit"
description: "Create a signed commit via GitHub API with version bump and build artifacts"

inputs:
  commit-message:
    description: "Commit message"
    required: true
  github-token:
    description: "GitHub token for API access"
    required: true

outputs:
  commit-sha:
    description: "SHA of the created commit"
  verified:
    description: "Whether the commit was verified"
  superseded:
    description: "`true` when the ref update was refused because the branch moved ahead of the commit this run built on (a newer run owns the change); no commit landed. `false` when the commit landed. Empty when there was nothing to commit."

runs:
  using: "node24"
  main: "action.mjs"
