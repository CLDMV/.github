name: "Update PR Title and Changelog"
description: "Update a pull request's title and body with the latest release changelog"

inputs:
  github-token:
    description: "GitHub token for API access"
    required: false
    default: ${{ github.token }}
  pr-number:
    description: "Pull request number"
    required: true
  new-version:
    description: "New release version (used for the PR title)"
    required: true
  title-suffix:
    description: "Optional suffix appended after 'release: vX.Y.Z - ' to distinguish PRs that share the same target version. When empty, the plain 'release: vX.Y.Z' form is used."
    required: false
    default: ""
  changelog-content:
    description: "Generated changelog markdown for the PR body"
    required: false
    default: ""
  co-authors:
    description: "Co-authored-by: trailer block (from generate-comprehensive-changelog's co-authors output) appended as the final paragraph of the PR body, below the sticky (coverage) blocks, so GitHub credits contributors on the squashed release commit. Empty = none."
    required: false
    default: ""

runs:
  using: "node24"
  main: "action.mjs"
