name: "Release Merge (API squash)"
description: "Approval-triggered API squash-merge of the persistent release PR (next/hotfixes → master), gated on the FULL check set, using the PR body verbatim as the commit message. Does not approve as the bot; the maintainer's approval is the gate. See #303."

inputs:
  github_token:
    description: "App token — needs contents: write + pull-requests: write (and must be allowed to land on the release branch), plus checks: read / statuses: read for the gate."
    required: true
  release_base_branches:
    description: "Comma-separated release/base branches the PR must target. Default master,main."
    required: false
    default: "master,main"
  integration_branches:
    description: "Comma-separated head branches a release PR may come from. Default next,hotfixes."
    required: false
    default: "next,hotfixes"
  allowed_associations:
    description: "Comma-separated author_association values whose approval arms the merge. Default MEMBER,OWNER."
    required: false
    default: "MEMBER,OWNER"
  require_approval:
    description: "Require a standing human approval before merging. Default true — leave on; the merge is otherwise ungated by a human."
    required: false
    default: "true"
  merge_method:
    description: "REST merge method: squash | merge | rebase. Default squash (the release commit is a single squashed commit on master)."
    required: false
    default: "squash"
  allow_failing_checks:
    description: "Comma-separated check-run names / status contexts that are allowed to conclude non-success without blocking the merge (rare — for a deliberately-optional check). Default none."
    required: false
    default: ""
  self_check_pattern:
    description: "Substring identifying THIS merge workflow's own check-run(s), excluded from the gate so it never waits on itself. Default: the workflow name ($GITHUB_WORKFLOW)."
    required: false
    default: ""

outputs:
  merged:
    description: "'true' when this run merged the PR, else 'false'."
  pr-number:
    description: "The release PR number acted on (empty when the event was not a release PR)."

runs:
  using: node24
  main: action.mjs
