name: "Update Release PR"
description: "Refresh an open release PR: re-evaluate version against current default branch, regenerate changelog, force-push the version-bump commit, update PR title and labels. Used by both workflow-release.yml (when push to release branch lands) and workflow-sync-open-release-prs.yml (when a sibling PR merges to master)."

inputs:
  head-ref:
    description: "The release branch to refresh (must have an open release PR)"
    required: true
  pr-number:
    description: "The PR number to update"
    required: true
  package-name:
    description: "NPM package name"
    required: true
  package-manager:
    description: "Package manager (npm or yarn)"
    required: false
    default: "npm"
  build-command:
    description: "Build command"
    required: false
    default: "npm run build:ci"
  default-branch:
    description: "Resolved release base branch. Empty (default) = auto-detect (master/main). When set, it takes precedence for the divergence/version base."
    required: false
    default: ""
  node-version:
    description: "Node.js version to use"
    required: false
    default: "lts/*"
  github-token:
    description: "App-token bearer (contents:write + pull-requests:write required)"
    required: true
  debug:
    description: "Enable debug logging"
    required: false
    default: "false"
  changelog-dir:
    description: "Base directory searched for a committed per-version changelog file. When one matching the resolved version exists on the head branch, its contents become the release-PR body. Empty (default) searches both `docs/changelog` and `docs/changelogs`."
    required: false
    default: ""
  changelog-file:
    description: "Optional explicit path-template override for the changelog file (supports `{version}`/`{major}`). Takes precedence over the default lookup."
    required: false
    default: ""
  bot-name:
    description: "Commit-signing bot identity name (e.g. secrets.CLDMV_BOT_NAME), passed through to generate-comprehensive-changelog so its own commits (a real GitHub user account, not a GitHub App) are recognized as bot commits rather than listed as a contributor."
    required: false
    default: ""
  bot-email:
    description: "Commit-signing bot identity email (e.g. secrets.CLDMV_BOT_EMAIL). See bot-name."
    required: false
    default: ""

outputs:
  new-version:
    description: "The recalculated version that the PR now targets (empty if no release-worthy commit was found)"
    value: ${{ steps.version.outputs.new-version }}
  should-update:
    description: "'true' if a release-worthy commit was found and the PR was updated; 'false' otherwise"
    value: ${{ steps.release-check.outputs.should-create-pr }}
  previous-version:
    description: "The version embedded in the PR title before this refresh (empty when the title doesn't carry one, e.g. first open)."
    value: ${{ steps.prev-version.outputs.version }}
  version-changed:
    description: "'true' when the recalculated version differs from the PR's previous title-encoded version. Use as a gate for release-PR notifications so the changelog-only refreshes don't fan out a fresh announcement."
    value: ${{ steps.prev-version.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Checkout PR branch
      uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4
      with:
        ref: ${{ inputs.head-ref }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: CLDMV/.github/.github/actions/common/steps/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Ensure the resolved base ref is present locally before find-divergence
    # runs merge-base / reads its package.json version.
    - name: Fetch release base branch
      if: inputs.default-branch != ''
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
      run: git fetch origin "$DEFAULT_BRANCH" --quiet || true

    - name: Get branch divergence point
      id: divergence
      uses: CLDMV/.github/.github/actions/git/steps/find-divergence@v4
      env:
        DEFAULT_BRANCH: ${{ inputs.default-branch }}

    - name: Check release commit type
      id: release-check
      uses: CLDMV/.github/.github/actions/git/steps/check-release-commit@v4
      with:
        base-ref: ${{ steps.divergence.outputs.merge-base }}
        base-version: ${{ steps.divergence.outputs.base-version }}
        # Opt-in: when the target version's bot bump is already on the branch,
        # still emit should-create-pr=true (with bump-already-applied=true) so
        # we can refresh the changelog/body/labels for the new commit without
        # re-pushing a duplicate version-bump commit.
        allow-already-bumped: "true"
      env:
        DEBUG: ${{ inputs.debug }}

    # Steps gated only on should-create-pr run regardless of whether the bump
    # has already been applied — they only read state. Version-mutating steps
    # below ALSO gate on bump-already-applied != 'true'.

    - name: Calculate new version
      id: version
      if: steps.release-check.outputs.should-create-pr == 'true'
      uses: CLDMV/.github/.github/actions/npm/steps/calculate-version@v4
      with:
        version-bump: ${{ steps.release-check.outputs.version-bump }}
        explicit-version: ${{ steps.release-check.outputs.explicit-version }}
        base-version: ${{ steps.divergence.outputs.base-version }}

    - name: Install dependencies
      if: steps.release-check.outputs.should-create-pr == 'true' && steps.release-check.outputs.bump-already-applied != 'true'
      uses: CLDMV/.github/.github/actions/npm/steps/install-dependencies@v4
      with:
        package-manager: ${{ inputs.package-manager }}

    - name: Build package
      if: steps.release-check.outputs.should-create-pr == 'true' && steps.release-check.outputs.bump-already-applied != 'true'
      uses: CLDMV/.github/.github/actions/common/steps/build-project@v4
      with:
        build-command: ${{ inputs.build-command }}
        environment: production

    - name: Update package version
      if: steps.release-check.outputs.should-create-pr == 'true' && steps.release-check.outputs.bump-already-applied != 'true'
      uses: CLDMV/.github/.github/actions/npm/steps/update-package-version@v4
      with:
        new-version: ${{ steps.version.outputs.new-version }}
        package-manager: ${{ inputs.package-manager }}

    - name: Restore src/ deleted by build
      if: steps.release-check.outputs.should-create-pr == 'true' && steps.release-check.outputs.bump-already-applied != 'true'
      uses: CLDMV/.github/.github/actions/git/steps/restore-deleted-src@v4

    - name: Create signed commit
      if: steps.release-check.outputs.should-create-pr == 'true' && steps.release-check.outputs.bump-already-applied != 'true'
      uses: CLDMV/.github/.github/actions/github/api/commit@v4
      with:
        commit-message: "chore: bump version to ${{ steps.version.outputs.new-version }}"
        github-token: ${{ inputs.github-token }}

    - name: Determine display version
      id: display-version
      if: steps.release-check.outputs.should-create-pr == 'true'
      uses: CLDMV/.github/.github/actions/npm/steps/resolve-version@v4
      with:
        new-version: ${{ steps.version.outputs.new-version }}

    - name: Get PR commit range
      id: get-pr-range
      if: steps.release-check.outputs.should-create-pr == 'true'
      uses: CLDMV/.github/.github/actions/github/steps/get-pr-commit-range@v4
      with:
        github-token: ${{ inputs.github-token }}
        pr-number: ${{ inputs.pr-number }}

    - name: Generate updated changelog
      id: changelog
      if: steps.release-check.outputs.should-create-pr == 'true'
      uses: CLDMV/.github/.github/actions/git/steps/generate-comprehensive-changelog@v4
      with:
        commit-range: ${{ steps.get-pr-range.outputs.commit-range }}
        # next/hotfixes → master release PR body groups each section by the
        # source PR. See create-release-pr/action.yml for the rationale.
        group-by-pr: "true"
        # Resolved release base so the changelog's release-PR filter recognizes
        # the head=next/hotfixes → base=<resolved> release PR (not just master).
        default-branch: ${{ inputs.default-branch }}
        # When a committed changelog file for this version exists on the head
        # branch, the generator uses it as the PR body (contributors still
        # appended). Absent → the generated changelog above.
        new-version: ${{ steps.version.outputs.new-version }}
        changelog-dir: ${{ inputs.changelog-dir }}
        changelog-file: ${{ inputs.changelog-file }}
        bot-name: ${{ inputs.bot-name }}
        bot-email: ${{ inputs.bot-email }}
        # Bot App token — same role as the create-release-pr counterpart:
        # the PR-ref augmentation needs auth'd /commits/{sha}/pulls calls
        # so the original branch commits get associated with their source
        # PR and grouped under it. Without this, the secondary commits
        # fall to the bottom as ungrouped flat bullets.
        github-token: ${{ inputs.github-token }}

    # Capture the version currently encoded in the PR title BEFORE we rewrite
    # it, so the calling workflow can gate a release-PR notification on
    # whether the version is actually changing this refresh.
    # PR titles look like `release: vX.Y.Z[ - suffix]`; an empty
    # previous-version (no match) is treated as a change too — covers the
    # first-refresh case where the PR was just opened by create-release-pr.
    - name: Capture previous PR version
      id: prev-version
      if: steps.release-check.outputs.should-create-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        NEW_VERSION: ${{ steps.version.outputs.new-version }}
      run: |
        set -euo pipefail
        title=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.title' 2>/dev/null || echo "")
        prev=$(printf '%s' "$title" | sed -nE 's/^release: v([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p')
        if [ -n "$prev" ] && [ "$prev" = "$NEW_VERSION" ]; then
            changed="false"
        else
            changed="true"
        fi
        echo "version=$prev" >> "$GITHUB_OUTPUT"
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        echo "📋 Previous version: ${prev:-<none>}   New version: $NEW_VERSION   Changed: $changed"

    - name: Update PR title and description
      if: steps.release-check.outputs.should-create-pr == 'true'
      uses: CLDMV/.github/.github/actions/github/steps/update-pr-changelog@v4
      with:
        github-token: ${{ inputs.github-token }}
        pr-number: ${{ inputs.pr-number }}
        new-version: ${{ steps.display-version.outputs.version }}
        title-suffix: ${{ steps.release-check.outputs.title-suffix }}
        changelog-content: ${{ steps.changelog.outputs.changelog-content }}

    # Extract the set of conventional-commit types present in the PR range so a
    # mixed PR (e.g. feat: + fix:) gets BOTH type: feature + type: bug
    # — not just the label corresponding to the bump-type (the highest).
    # Filters bot/merge/release commits + the auto chore-bump (loop noise).
    - name: Compute commit types in PR range
      id: pr-types
      if: steps.release-check.outputs.should-create-pr == 'true'
      shell: bash
      env:
        RANGE: ${{ steps.get-pr-range.outputs.commit-range }}
      run: |
        types=$(git log --no-merges --format='%s' "$RANGE" \
            | { grep -vE '^(release|chore: bump version)' || true; } \
            | { grep -oiE '^[a-z]+(\([^)]+\))?!?:' || true; } \
            | sed -E 's/[(!:].*//' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u | paste -sd,)
        echo "types=${types:-}" >> "$GITHUB_OUTPUT"
        echo "📊 commit types in range: ${types:-<none>}"

    - name: Compute raw label aliases
      id: raw-labels
      if: steps.release-check.outputs.should-create-pr == 'true'
      uses: CLDMV/.github/.github/actions/github/steps/compute-label-aliases@v4
      with:
        bump-type: ${{ steps.release-check.outputs.version-bump }}
        types-present: ${{ steps.pr-types.outputs.types }}

    - name: Resolve PR label aliases
      id: resolved-labels
      if: steps.release-check.outputs.should-create-pr == 'true'
      uses: CLDMV/.github/.github/actions/github/steps/resolve-labels@v4
      with:
        aliases: ${{ steps.raw-labels.outputs.labels }}

    # Append the v4 flow label based on the head-ref lane:
    #   head=next     → `! release → master`
    #   head=hotfixes → `! hotfix release → master`
    # The leading `!` sorts the label first in GitHub's alphabetical display
    # so a glance at the PR list shows which lane each release PR is on.
    - name: Append flow label
      id: final-labels
      if: steps.release-check.outputs.should-create-pr == 'true'
      shell: bash
      env:
        HEAD_REF: ${{ inputs.head-ref }}
        # Resolved release base (matches the PR's actual base). Empty inputs
        # (legacy direct callers) keep the historical `master` label.
        BASE: ${{ inputs.default-branch != '' && inputs.default-branch || 'master' }}
      run: |
        case "$HEAD_REF" in
            next)      flow_label="! release → ${BASE}" ;;
            hotfixes)  flow_label="! hotfix release → ${BASE}" ;;
            *)         flow_label="" ;;
        esac
        labels='${{ steps.resolved-labels.outputs.labels }}'
        if [ -n "$flow_label" ]; then
            if [ -n "$labels" ]; then
                labels="${labels},${flow_label}"
            else
                labels="$flow_label"
            fi
        fi
        echo "labels=$labels" >> "$GITHUB_OUTPUT"
        # managed-labels allowlist: base set + master/main flow-label variants
        # (so a stale lane label prunes across a default-branch rename) plus the
        # resolved base's own variant when it's neither.
        managed="release,semver: patch,semver: minor,semver: major,semver: explicit,type: bug,type: feature,type: feature request,! release → master,! release → main,! hotfix release → master,! hotfix release → main"
        case "$BASE" in
            master|main) ;;
            *) managed="${managed},! release → ${BASE},! hotfix release → ${BASE}" ;;
        esac
        echo "managed-labels=$managed" >> "$GITHUB_OUTPUT"

    # managed-labels scopes the replace: only labels in this allowlist are
    # removed when not in `labels`. Path-based labels owned by the PR labeler
    # workflow (type: ci / type: documentation / type: config / area: *) are
    # OUTSIDE the allowlist and stay untouched — preventing the remove-then-
    # re-add churn that bit the v4.0.1 refresh.
    # Flow labels are IN the allowlist so the right lane indicator wins if
    # the head-ref ever changes between refreshes.
    - name: Sync PR labels
      if: steps.release-check.outputs.should-create-pr == 'true'
      uses: CLDMV/.github/.github/actions/github/steps/sync-pr-labels@v4
      with:
        github-token: ${{ inputs.github-token }}
        pr-number: ${{ inputs.pr-number }}
        labels: ${{ steps.final-labels.outputs.labels }}
        managed-labels: ${{ steps.final-labels.outputs.managed-labels }}
