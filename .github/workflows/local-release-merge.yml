# v4 core (opt-in): squash-merge the persistent `next → master` release PR on
# MY APPROVAL, via the REST merge API with the PR body as the commit message.
# Thin caller — all logic lives in workflow-release-merge.yml (this repo's own
# copy, referenced via a relative `uses:` since it's a local workflow calling
# another local workflow) so bumping it carries fixes without editing this file.
#
# NOTE: pull_request_review / workflow_run events run the copy of this file
# (and of workflow-release-merge.yml) that's on the DEFAULT branch, so this
# only takes effect once it ships to master with a release — the PR that adds
# this file must still be merged manually the first time.
#
# Re-evaluation when an approval precedes green CI uses `workflow_run`, not
# `check_suite` — GitHub does not send `check_suite: completed` for a suite
# created by GitHub Actions itself (which is every check in this repo's CI),
# only for suites created by a third-party App. #318: an approval given before
# CI finished left a release PR stuck fully green with nothing re-firing the
# merge check, because check_suite silently never fires for that case at all.
# `workflow_run` is GitHub's documented replacement for exactly this — it
# fires on completion of the named workflow regardless of who created its
# checks.
#
# The merge gate waits on EVERY check-run on the release PR's head commit, from
# any workflow, so `workflows:` must name every workflow that puts a check on
# that commit — not just CI. Whichever finishes last is the only one whose
# completion can see a fully green head; if it isn't listed, nothing re-fires
# and the PR sits approved + green (v4.29.1, PR #322: CI finished at 05:00:10,
# the last re-evaluation saw CodeQL still running, CodeQL finished at 05:00:51
# and wasn't listed). `branches:` limits re-fires to runs on the integration
# branches, so feature-branch CI doesn't wake this up.
#
# Concurrency below keeps one run + one pending; a newer arrival replaces the
# pending run (even with cancel-in-progress: false). That's harmless — every
# run re-reads the approval and check state from the API, so the newest
# pending run always covers the ones it replaced.
# STATUS: v4.
name: 🚦 Local Release Merge (v4)

on:
    pull_request_review:
        types: [submitted] # approval arms it
    workflow_run: # re-evaluate as each check-producing workflow finishes — see #318
        workflows:
            - "🧪 Local CI"
            - "🔍 Local CodeQL"
            - "🚀 Local Next Release (v4)"
            - "🚑 Local Hotfixes Release (v4)"
            - "🌿 Local Branch Retention"
            - "🏷️ Local PR Labeler"
            - "🏷️ Local PR Title Normalizer"
            - "👋 Local Welcome"
            - "🔀 Local Hotfix PR Redirector (v4)"
            - "🚀 Local Member Auto-Enable Auto-Merge"
        types: [completed]
        branches: [next, hotfixes]
    workflow_dispatch: # manual re-evaluation

# Serialize: each run re-resolves the release PR + re-gates the head, so queue
# (don't cancel) to avoid racing a merge that's already in flight.
concurrency:
    group: local-release-merge-${{ github.repository }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    merge:
        permissions:
            contents: write
            pull-requests: write
            checks: read
            statuses: read
        uses: ./.github/workflows/workflow-release-merge.yml
        secrets:
            BOT_APP_CLIENT_ID: ${{ secrets.CLDMV_BOT_APP_CLIENT_ID }}
            BOT_APP_PRIVATE_KEY: ${{ secrets.CLDMV_BOT_APP_PRIVATE_KEY }}
