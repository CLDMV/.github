# v4 core (opt-in): squash-merge the persistent `next → master` release PR on
# MY APPROVAL, via the REST merge API with the PR body as the commit message.
# Thin caller — all logic lives in workflow-release-merge.yml (this repo's own
# copy, referenced via a relative `uses:` since it's a local workflow calling
# another local workflow) so bumping it carries fixes without editing this file.
#
# NOTE: pull_request_review / check_suite events run the copy of this file (and
# of workflow-release-merge.yml) that's on the DEFAULT branch, so this only
# takes effect once it ships to master with a release — the PR that adds this
# file must still be merged manually the first time.
# STATUS: v4.
name: 🚦 Local Release Merge (v4)

on:
    pull_request_review:
        types: [submitted] # approval arms it
    check_suite:
        types: [completed] # re-evaluate when CI finishes (approval may precede green)
    workflow_dispatch: # manual re-evaluation

# Serialize: each run re-resolves the release PR + re-gates the head, so queue
# (don't cancel) to avoid racing a merge that's already in flight.
concurrency:
    group: local-release-merge-${{ github.repository }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    merge:
        permissions:
            contents: write
            pull-requests: write
            checks: read
            statuses: read
        uses: ./.github/workflows/workflow-release-merge.yml
        secrets:
            BOT_APP_CLIENT_ID: ${{ secrets.CLDMV_BOT_APP_CLIENT_ID }}
            BOT_APP_PRIVATE_KEY: ${{ secrets.CLDMV_BOT_APP_PRIVATE_KEY }}
