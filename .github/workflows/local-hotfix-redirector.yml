# v4 hotfix lane: retarget hotfix/security PRs to the `hotfixes` branch. Thin
# caller — all job logic (token, checkout, git identity, redirect action) lives
# in workflow-hotfix-redirector.yml, so bumping it carries new requirements
# (e.g. the checkout + git identity the cherry-pick path needs) without editing
# this file. The trigger + concurrency stay here (GitHub requires the trigger
# to be declared locally).
#
# STATUS: v4 preview. Assumes `hotfixes` exists (v4-adopted repos only).
#
# SECURITY NOTE: pull_request_target runs in the BASE repo's context with WRITE
# permissions + secrets. The reusable checks out `hotfixes` (a trusted base-repo
# branch, NOT the PR head/fork) and only cherry-picks/pushes against it.
#
# `opened` only (NOT `edited`): if a maintainer manually re-targets the PR, we
# must not fight them by redirecting again.
name: 🔀 Local Hotfix PR Redirector (v4)

on:
    pull_request_target:
        types: [opened]

concurrency:
    group: hotfix-redirector-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    redirect:
        permissions:
            contents: write
            pull-requests: write
        uses: ./.github/workflows/workflow-hotfix-redirector.yml
        secrets:
            BOT_APP_CLIENT_ID: ${{ secrets.CLDMV_BOT_APP_CLIENT_ID }}
            BOT_APP_PRIVATE_KEY: ${{ secrets.CLDMV_BOT_APP_PRIVATE_KEY }}
