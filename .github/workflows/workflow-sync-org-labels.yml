name: "🏷️ Sync Org Labels"

on:
    workflow_call:
        inputs:
            runs_on:
                required: false
                type: string
                default: ""
                description: "Runner label for every job in this workflow chain. Empty = auto, in order: the caller's RUNS_ON_DEFAULT Actions variable (all trigger types incl. schedule); else CLDMV-owned private callers route to cldmv-runners; else ubuntu-latest."
            repos:
                description: "Optional comma / space / newline separated repo list (each with or without an `owner/` prefix) to scope the sync to just those repos. Empty (default) sweeps the whole org."
                type: string
                default: ""
            dry_run:
                description: "Dry run — report what would change without applying it"
                type: boolean
                default: false
            debug:
                description: "Enable debug logging"
                type: boolean
                default: false
        secrets:
            BOT_APP_CLIENT_ID:
                description: "GitHub App Client ID for CLDMV bot"
                required: true
            BOT_APP_PRIVATE_KEY:
                description: "GitHub App private key for CLDMV bot"
                required: true

permissions:
    contents: read

jobs:
    sync-labels:
        name: "🏷️ Sync Labels Across Org"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        steps:
            - name: Checkout .github repo
              uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4

            - name: Setup Node.js
              uses: CLDMV/.github/.github/actions/common/steps/setup-node@v4

            - name: Create App token (org-wide)
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}

            - name: Sync org labels
              uses: CLDMV/.github/.github/actions/github/jobs/sync-org-labels@v4
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  org: ${{ github.repository_owner }}
                  repos: ${{ inputs.repos }}
                  dry-run: ${{ inputs.dry_run || false }}
                  debug: ${{ inputs.debug || false }}
