# v4: normalize contributor PR titles to Conventional Commits format. Thin
# caller — all job logic lives in workflow-pr-title-normalizer.yml so bumping
# it carries fixes without editing this file. The trigger + concurrency stay
# here (GitHub requires the trigger to be declared locally).
#
# SECURITY NOTE: pull_request_target runs in the BASE repo's context with WRITE
# permissions and access to secrets. SAFE — the reusable's path is API-only (it
# never checks out or executes PR content). Triggers on opened + synchronize
# only (NOT edited): a maintainer hand-editing the title must not kick off a
# re-normalize loop.
name: 🏷️ Local PR Title Normalizer

on:
    pull_request_target:
        types: [opened, synchronize]

# Collapse a burst of pushes to one normalize run per PR; the newest push
# carries the authoritative commit set, so cancelling an in-flight run is fine.
concurrency:
    group: pr-title-normalizer-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    normalize:
        permissions:
            contents: read
            pull-requests: write
        uses: ./.github/workflows/workflow-pr-title-normalizer.yml
        secrets:
            BOT_APP_CLIENT_ID: ${{ secrets.CLDMV_BOT_APP_CLIENT_ID }}
            BOT_APP_PRIVATE_KEY: ${{ secrets.CLDMV_BOT_APP_PRIVATE_KEY }}
