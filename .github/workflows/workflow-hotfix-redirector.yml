# Reusable: v4 hotfix lane — retarget hotfix/security PRs to the `hotfixes`
# branch. Two paths trigger a redirect (docs/conventions/release-flow-v4.md
# §5.2, §6.5):
#   1. Head branch matches `hotfix/*` or `security/*` (human-driven hotfix flow)
#      — a plain base PATCH.
#   2. Author is `dependabot[bot]` AND its base isn't Dependabot's routine
#      target-branch (`dependabot_base`, default `next`) — GitHub always
#      overrides dependabot.yml's target-branch for security updates, so a base
#      landing on the default branch instead of `next` is itself the signal
#      (Dependabot's PR body doesn't reliably embed the GHSA id, so a literal
#      GHSA reference is only a secondary check). These are cherry-picked onto a
#      fresh branch cut from `hotfixes`' own tip and reopened there.
#
# This owns the token/checkout/identity/action-call so callers stay thin —
# bumping `@v4` carries new requirements (e.g. the checkout + git identity the
# cherry-pick path needs) to every repo automatically, instead of each repo
# carrying a copied job that can drift out of date. The `pull_request_target`
# trigger + concurrency live in the CALLER (GitHub requires the trigger local).
#
# STATUS: v4. Assumes `hotfixes` exists (v4-adopted repos only).
#
# SECURITY NOTE: callers trigger on pull_request_target (base-repo context,
# write token, secrets). The checkout below targets `target_base` — a TRUSTED
# base-repo branch, NOT the PR's head/fork — and the action only ever runs
# `git cherry-pick`/`push` against it; it never executes anything from the PR
# branch. Do NOT change the checkout `ref` to the PR head/merge ref.
name: 🔀 Hotfix PR Redirector (v4 reusable)

on:
    workflow_call:
        inputs:
            target_base:
                description: "Branch to redirect hotfix/security PRs to (the hotfix integration branch)."
                required: false
                type: string
                default: "hotfixes"
            dependabot_base:
                description: "Branch Dependabot's routine (non-security) version updates target — dependabot.yml's `target-branch`. Any Dependabot PR whose base differs is treated as a security override."
                required: false
                type: string
                default: "next"
            hotfix_branch_pattern:
                description: "Regex (no anchors needed; matched against the start of the head ref) for human hotfix branches that should be redirected. Empty uses the action default (^(hotfix|security)/)."
                required: false
                type: string
                default: ""
        secrets:
            BOT_APP_CLIENT_ID:
                description: "GitHub App client id for the bot that redirects PRs and pushes the cherry-pick."
                required: true
            BOT_APP_PRIVATE_KEY:
                description: "GitHub App private key for the bot."
                required: true

permissions:
    contents: write
    pull-requests: write

jobs:
    redirect:
        name: "🔀 Redirect to hotfixes"
        runs-on: ubuntu-latest
        steps:
            - name: Create App token
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  # The dependabot-security path pushes a cherry-picked branch.
                  permission_contents: "true"
                  # The action reads the PR (GET /pulls), retargets/reopens it
                  # (PATCH/POST /pulls) and comments — pull-requests: write. Without
                  # this the fine-grained token has no PR access and the first
                  # `GET /pulls/{n}` 403s ("Resource not accessible by integration").
                  permission_pull_requests: "true"
                  # Redirect labels the PR via the issues API (POST /issues/{n}/labels).
                  permission_issues: "true"
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            # `target_base` (a trusted base-repo branch, not the PR head) — the
            # dependabot-security path cherry-picks onto its tip. Cheap no-op
            # for the plain-PATCH "hotfix" path, which doesn't need it.
            - name: Checkout target base
              uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4
              with:
                  ref: ${{ inputs.target_base }}
                  fetch-depth: 0

            - name: Setup bot git identity
              uses: CLDMV/.github/.github/actions/github/steps/setup-git-identity@v4
              with:
                  app-slug: ${{ steps.app-token.outputs.app-slug }}
                  github-token: ${{ steps.app-token.outputs.token }}

            - name: Redirect hotfix/security PR to hotfixes
              uses: CLDMV/.github/.github/actions/github/steps/redirect-hotfix-pr@v4
              with:
                  pr-number: ${{ github.event.pull_request.number }}
                  github-token: ${{ steps.app-token.outputs.token }}
                  head-ref: ${{ github.event.pull_request.head.ref }}
                  base-ref: ${{ github.event.pull_request.base.ref }}
                  user-type: ${{ github.event.pull_request.user.type }}
                  target-base: ${{ inputs.target_base }}
                  dependabot-base: ${{ inputs.dependabot_base }}
                  hotfix-branch-pattern: ${{ inputs.hotfix_branch_pattern }}
