# Release Merge — approval-triggered API squash-merge (v4 reusable).
#
# Squash-merges the persistent release PR (next/hotfixes → master) via the REST
# merge API with an EXPLICIT commit message = the PR body, so the release commit
# is exactly the curated body: no mobile Default-path title-only drop, and no
# GitHub UI co-author auto-append (the clean `<!-- co-authors -->` block in the
# body is the whole credit). Does NOT approve as the bot — the maintainer's
# approval is the gate. Merges only when EVERY check on the head (required AND
# non-required — e.g. the coverage badge and the release-PR body refresh) has
# finished and passed, so the body it reads is never stale.
#
# The caller fires this on `pull_request_review` (approved) to arm it and on
# `check_suite: completed` to re-evaluate, so an approval given before CI is
# green still merges once the last check goes green. See #303.
name: 🚦 Release Merge (v4 reusable)

on:
    workflow_call:
        inputs:
            runs_on:
                required: false
                type: string
                default: ""
                description: "Runner label for every job in this workflow chain. Empty = auto, in order: the caller's RUNS_ON_DEFAULT Actions variable; else CLDMV-owned private callers route to cldmv-runners; else ubuntu-latest."
            release_base_branches:
                description: "Comma-separated release/base branches the PR must target (default master,main)."
                required: false
                type: string
                default: "master,main"
            integration_branches:
                description: "Comma-separated head branches a release PR may come from (default next,hotfixes)."
                required: false
                type: string
                default: "next,hotfixes"
            allowed_associations:
                description: "Comma-separated author_association values whose approval arms the merge (default MEMBER,OWNER)."
                required: false
                type: string
                default: "MEMBER,OWNER"
            require_approval:
                description: "Require a standing human approval before merging (default true — leave on)."
                required: false
                type: boolean
                default: true
            merge_method:
                description: "REST merge method: squash | merge | rebase (default squash)."
                required: false
                type: string
                default: "squash"
            allow_failing_checks:
                description: "Comma-separated check names / status contexts allowed to conclude non-success without blocking (rare). Default none."
                required: false
                type: string
                default: ""
        secrets:
            BOT_APP_CLIENT_ID:
                required: true
            BOT_APP_PRIVATE_KEY:
                required: true

# contents: write + pull-requests: write to merge; checks/statuses read for the gate.
permissions:
    contents: write
    pull-requests: write
    checks: read
    statuses: read

jobs:
    merge:
        name: "🚦 Release Merge"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        steps:
            - name: Create App token
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            - name: Merge release PR
              uses: CLDMV/.github/.github/actions/github/jobs/release-merge@v4
              with:
                  github_token: ${{ steps.app-token.outputs.token }}
                  release_base_branches: ${{ inputs.release_base_branches }}
                  integration_branches: ${{ inputs.integration_branches }}
                  allowed_associations: ${{ inputs.allowed_associations }}
                  require_approval: ${{ inputs.require_approval }}
                  merge_method: ${{ inputs.merge_method }}
                  allow_failing_checks: ${{ inputs.allow_failing_checks }}
                  # Exclude this workflow's own check-run from the gate so it
                  # never waits on itself. Matches the job name above.
                  self_check_pattern: "Release Merge"
