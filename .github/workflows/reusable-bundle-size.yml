# Bundle-size diff on PRs (org-level, reusable).
# Roll our own — no dependency on andresz1/size-limit-action.
# Builds head + base in parallel, compares artifacts, posts/updates comment.
# Batch 5.4 from tmp/plan-future-workflows.md.
name: 📊 Bundle Size Diff (Org-Level)

on:
    workflow_call:
        inputs:
            runs_on:
                required: false
                type: string
                default: ""
                description: "Runner label for every job in this workflow chain. Empty = auto, in order: the caller's RUNS_ON_DEFAULT Actions variable (all trigger types incl. schedule); else CLDMV-owned private callers route to cldmv-runners; else ubuntu-latest."
            build_command:
                required: false
                type: string
                default: "npm run build"
            dist_paths:
                required: false
                type: string
                default: "dist/**"
            package_manager:
                required: false
                type: string
                default: "auto"
            node_version:
                required: false
                type: string
                default: "lts/*"
            warning_pct:
                required: false
                type: number
                default: 5
            warning_bytes:
                required: false
                type: number
                default: 500
            comment_mode:
                required: false
                type: string
                default: "update"
        secrets:
            # Optional. When provided, the PR size-diff comment is posted by
            # the consumer's bot App instead of github-actions[bot]. Falls back
            # to GITHUB_TOKEN via create-app-token's auto-detect.
            BOT_APP_CLIENT_ID:
                required: false
            BOT_APP_PRIVATE_KEY:
                required: false

permissions:
    contents: read
    pull-requests: write

jobs:
    build-head:
        name: "📊 Measure HEAD"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        steps:
            - name: Checkout PR head
              uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
            - name: Resolve package manager
              id: pm
              uses: CLDMV/.github/.github/actions/npm/utilities/detect-package-manager@v4
              with:
                  package-manager: ${{ inputs.package_manager }}
            - name: Setup Node
              uses: CLDMV/.github/.github/actions/common/steps/setup-node@v4
              with:
                  node-version: ${{ inputs.node_version }}
            - name: Install
              uses: CLDMV/.github/.github/actions/npm/steps/install-dependencies@v4
              env:
                  CLDMV_SKIP_FROZEN_LOCKFILE: ${{ vars.CLDMV_SKIP_FROZEN_LOCKFILE }}
              with:
                  package-manager: ${{ steps.pm.outputs.package-manager }}
            - name: Build
              shell: bash
              env:
                  PM: ${{ steps.pm.outputs.package-manager }}
                  CMD: ${{ inputs.build_command }}
              run: |
                  cmd="$CMD"
                  if [ "$PM" != "npm" ]; then
                    case "$cmd" in
                      "npm "*) cmd="$PM ${cmd#npm }" ;;
                      "npx "*) if [ "$PM" = "pnpm" ]; then cmd="pnpm dlx ${cmd#npx }"; fi ;;
                    esac
                  fi
                  echo "▶ $cmd"
                  eval "$cmd"
            - name: Measure
              uses: CLDMV/.github/.github/actions/npm/jobs/bundle-size@v4
              with:
                  mode: measure
                  dist_paths: ${{ inputs.dist_paths }}
                  output_file: sizes.json
            - name: Upload head sizes
              uses: actions/upload-artifact@v6
              with:
                  name: head-sizes
                  path: sizes.json

    build-base:
        name: "📊 Measure BASE"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        steps:
            - name: Checkout PR base
              uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
            - name: Resolve package manager
              id: pm
              uses: CLDMV/.github/.github/actions/npm/utilities/detect-package-manager@v4
              with:
                  package-manager: ${{ inputs.package_manager }}
            - name: Setup Node
              uses: CLDMV/.github/.github/actions/common/steps/setup-node@v4
              with:
                  node-version: ${{ inputs.node_version }}
            - name: Install
              uses: CLDMV/.github/.github/actions/npm/steps/install-dependencies@v4
              env:
                  CLDMV_SKIP_FROZEN_LOCKFILE: ${{ vars.CLDMV_SKIP_FROZEN_LOCKFILE }}
              with:
                  package-manager: ${{ steps.pm.outputs.package-manager }}
            - name: Build
              id: build
              shell: bash
              env:
                  PM: ${{ steps.pm.outputs.package-manager }}
                  CMD: ${{ inputs.build_command }}
              run: |
                  cmd="$CMD"
                  if [ "$PM" != "npm" ]; then
                    case "$cmd" in
                      "npm "*) cmd="$PM ${cmd#npm }" ;;
                      "npx "*) if [ "$PM" = "pnpm" ]; then cmd="pnpm dlx ${cmd#npx }"; fi ;;
                    esac
                  fi
                  # A base that predates the build script (the first release PR of a
                  # newly onboarded repo, whose master is still the initial commit)
                  # has no bundle to measure: record an empty baseline, so every head
                  # file shows as new, instead of failing on the missing script.
                  if [[ "$cmd" =~ ^(npm|pnpm|yarn)[[:space:]]+run[[:space:]]+([^[:space:]]+)$ ]]; then
                    script="${BASH_REMATCH[2]}"
                    if ! node -e 'const s = require("./package.json").scripts || {}; process.exit(Object.hasOwn(s, process.argv[1]) ? 0 : 1);' "$script" 2>/dev/null; then
                      message="The base has no \`$script\` script, so there is no baseline to measure; every file counts as new."
                      echo "::notice title=Bundle size - no baseline::$message"
                      echo "ℹ️ $message" >> "$GITHUB_STEP_SUMMARY"
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                  fi
                  echo "▶ $cmd"
                  # The base is code that has already landed, so this PR cannot fix a
                  # base whose build script is broken (e.g. a pre-onboarding master
                  # pointing at a script that no longer exists). Fall back to an empty
                  # baseline with a warning; the head build is still measured and still
                  # fails the run if it breaks.
                  if ! eval "$cmd"; then
                    message="The base build (\`$cmd\`) failed, so there is no baseline to measure; every file counts as new. The head build is measured separately."
                    echo "::warning title=Bundle size - no baseline::$message"
                    echo "⚠️ $message" >> "$GITHUB_STEP_SUMMARY"
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Measure
              if: steps.build.outputs.skip != 'true'
              uses: CLDMV/.github/.github/actions/npm/jobs/bundle-size@v4
              with:
                  mode: measure
                  dist_paths: ${{ inputs.dist_paths }}
                  output_file: sizes.json
            - name: Empty baseline
              if: steps.build.outputs.skip == 'true'
              shell: bash
              run: echo '{"files":[],"total":{"raw":0,"gzip":0,"brotli":0}}' > sizes.json
            - name: Upload base sizes
              uses: actions/upload-artifact@v6
              with:
                  name: base-sizes
                  path: sizes.json

    compare:
        name: "📊 Compare"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        needs: [build-head, build-base]
        steps:
            - name: Create App token (falls back to GITHUB_TOKEN)
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            - name: Download head sizes
              uses: actions/download-artifact@v7
              with:
                  name: head-sizes
                  path: head-sizes
            - name: Download base sizes
              uses: actions/download-artifact@v7
              with:
                  name: base-sizes
                  path: base-sizes
            - name: Compare and comment
              uses: CLDMV/.github/.github/actions/npm/jobs/bundle-size@v4
              with:
                  mode: compare
                  head_sizes: head-sizes/sizes.json
                  base_sizes: base-sizes/sizes.json
                  pr_number: ${{ github.event.pull_request.number }}
                  warning_pct: ${{ inputs.warning_pct }}
                  warning_bytes: ${{ inputs.warning_bytes }}
                  comment_mode: ${{ inputs.comment_mode }}
                  github_token: ${{ steps.app-token.outputs.token }}
