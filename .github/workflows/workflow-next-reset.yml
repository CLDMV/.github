# Reusable: after a release lands on master, re-sync the integration branches
# (docs/conventions/release-flow-v4.md §6.3, §7).
#
#   - `hotfixes` is ALWAYS moved onto the release commit after any release.
#   - `next` depends on which lane released:
#       * normal release (next → master, or a v3-style feat → master):
#         move `next` onto the release commit (§7.1).
#       * hotfix release (hotfixes → master): MERGE master into `next` instead,
#         so next's accumulated feature work is preserved (§7.2, option B). The
#         merge is a no-op (204) when next has no extra work.
#
# "Move onto the release" is reset-branch-after-release, not a blind force
# reset (#360): when the branch is exactly the release PR's head it is reset;
# when PRs merged into it after the release PR was cut (typically bot /
# Dependabot auto-merges landing seconds after a release), those commits are
# replayed onto the release commit instead of being dropped, and each affected
# PR gets a comment. Every ref update is a compare-and-swap against the tip the
# plan was built from (GraphQL updateRefs beforeOid, then git push
# --force-with-lease), so a merge landing mid-step makes the update fail and
# re-plan rather than be overwritten. A replay conflict leaves the branch
# untouched, fails the job, and opens an issue.
#
# The released lane and the release PR's head SHA are read from the PR
# associated with the release commit.
#
# wait-for-tags gate (CLDMV/.github ONLY): a release of CLDMV/.github also
# fires `update-major-version-tags`, which rolls the @vN tags that this
# workflow's own `uses: CLDMV/.github/...@v4` actions resolve to. Jobs resolve
# `uses:` at job start, so without the gate the sync job could run the
# PREVIOUS release's action code. The gate polls the released major's tag —
# parsed from the `release: vX.Y.Z` commit — until it matches the release
# commit. In a consumer repo its own tags have nothing to do with the @v4
# actions it runs (some consumers have no vN tag at all, so the gate always
# timed out at the full 2 minutes), and that 2-minute delay was exactly the
# window in which the #360 merges landed and were lost. So the gate runs only
# in the repo that self-hosts the actions, and consumers sync immediately.
#
# Self-healing: no-ops pre-cutover (neither integration branch exists), but
# post-cutover it RECREATES a branch that went missing (e.g. branch-retention
# deleting `next` as a merged PR head).
#
# This owns the job logic so callers stay thin — the `push` trigger to
# master/main lives in the CALLER (GitHub requires the trigger local).
# STATUS: v4.
name: ♻️ Next/Hotfixes Reset (v4 reusable)

on:
    workflow_call:
        inputs:
            runs_on:
                required: false
                type: string
                default: ""
                description: "Runner label for every job in this workflow chain. Empty = auto, in order: the caller's RUNS_ON_DEFAULT Actions variable (all trigger types incl. schedule); else CLDMV-owned private callers route to cldmv-runners; else ubuntu-latest."
        secrets:
            BOT_APP_CLIENT_ID:
                description: "GitHub App client id for the bot that resets/merges the integration branches."
                required: true
            BOT_APP_PRIVATE_KEY:
                description: "GitHub App private key for the bot."
                required: true

permissions:
    contents: write

jobs:
    wait-for-tags:
        # Only fire on a release commit (the squash-merge of a release PR), and
        # only in CLDMV/.github — the one repo whose release rolls the @v4 tags
        # the sync job's actions resolve to (see the header). Consumers skip it.
        if: startsWith(github.event.head_commit.message, 'release:') && github.repository == 'CLDMV/.github'
        name: "⏳ Wait for the released major tag to roll forward"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        timeout-minutes: 5
        steps:
            - name: Poll the released major tag until it matches the release commit
              shell: bash
              env:
                  TARGET_SHA: ${{ github.sha }}
                  REPO: ${{ github.repository }}
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
                  # Authenticates the tag lookup below (the job runs with
                  # contents: write). Without it a bare `git ls-remote` exit-128s
                  # on PRIVATE repos and — under `set -eo pipefail` — kills this
                  # gate job, so next/hotfixes never get reset after a release.
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "🔍 Release commit: $TARGET_SHA"
                  # Parse the released MAJOR from the `release: vX.Y.Z` subject and
                  # poll THAT tag (e.g. @v4 for v4.x). update-major-version-tags
                  # rolls @v<major> to the release commit; a hardcoded @v3 would
                  # never match on a major bump (which creates @v4).
                  major=$(printf '%s' "$COMMIT_MSG" | { grep -oiE 'release:[^0-9]*v?[0-9]+' || true; } | { grep -oE '[0-9]+$' || true; } | head -1)
                  if [ -z "$major" ]; then
                      echo "⚠️ Could not parse a major version from the commit subject — skipping the gate."
                      exit 0
                  fi
                  tag="v${major}"
                  echo "⏳ Gating on @${tag}…"
                  max_attempts=24   # 24 * 5s = 120s
                  # Authenticated so PRIVATE repos work (anon ls-remote 128s there).
                  # Non-fatal: a lookup failure logs and degrades to "proceed anyway"
                  # (the gate is only a safety delay) rather than aborting the reset,
                  # and errors reach the log — no `2>/dev/null` hiding the cause.
                  remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
                  for attempt in $(seq 1 $max_attempts); do
                      if ! sha=$(git ls-remote "$remote" "refs/tags/${tag}^{}" | awk '{print $1}'); then
                          echo "⚠️ ls-remote for @${tag} failed — will retry / degrade to proceed"
                          sha=""
                      fi
                      [ -z "$sha" ] && { sha=$(git ls-remote "$remote" "refs/tags/${tag}" | awk '{print $1}') || sha=""; }
                      echo "Attempt $attempt/$max_attempts: @${tag} → ${sha:-<not found>}"
                      if [ "$sha" = "$TARGET_SHA" ]; then
                          echo "✅ @${tag} matches the release commit — safe to proceed"
                          exit 0
                      fi
                      [ "$attempt" -lt "$max_attempts" ] && sleep 5
                  done
                  echo "⚠️ Timed out waiting for @${tag} — proceeding anyway."

    sync-branches:
        name: "♻️ Sync next + hotfixes to master"
        needs: wait-for-tags
        # Runs right away when the gate was skipped (every consumer repo), after
        # it otherwise. `!cancelled()` is required: a job whose `needs` was
        # skipped is itself skipped unless its `if` uses a status function.
        if: ${{ !cancelled() && startsWith(github.event.head_commit.message, 'release:') && (needs.wait-for-tags.result == 'success' || needs.wait-for-tags.result == 'skipped') }}
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        steps:
            - name: Create App token
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  # Pushing/merging master's tree (which includes
                  # .github/workflows/**) requires contents + workflows write.
                  permission_contents: "true"
                  permission_workflows: "true"
                  # create-app-token enters fine-grained mode as soon as ANY
                  # permission flag is set — granting ONLY the flags requested.
                  # Pull requests: the lane detection below reads the released PR
                  # (without the scope the read is silently denied and every hotfix
                  # release fell through to a reset, #278), and
                  # reset-branch-after-release comments on PRs whose merge it
                  # carried forward (#360) — so WRITE, not read.
                  permission_pull_requests: "true"
                  # Issues: reset-branch-after-release opens an issue when it cannot
                  # carry late commits forward (it never drops them silently).
                  permission_issues: "true"
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            - name: Checkout master
              uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4
              with:
                  fetch-depth: 0

            - name: Determine released lane
              id: lane
              shell: bash
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  RELEASE_SHA: ${{ github.sha }}
              run: |
                  # Identify the released PR from the squash commit itself, via GitHub's
                  # "list pull requests associated with a commit" API — NOT by parsing the
                  # commit message. The release squash message is fully custom (subject =
                  # the release PR title, body = the entire changelog): it carries no
                  # trailing "(#N)", and the body references many issues/PRs (#123, …), so
                  # the previous `grep '#[0-9]+' | tail -1` picked a changelog reference (an
                  # issue number, e.g. #423) instead of the release PR. `gh pr view` on that
                  # number failed, and EVERY normal release fell through to the fail-safe
                  # merge below — leaving next un-reset and re-cutting the just-shipped work
                  # as a phantom next-release (a bumped version with no real change).
                  #
                  # The lane decides next's fate: a NORMAL release (next → master) means
                  # next's work just shipped, so next is RESET to master; a HOTFIX release
                  # (hotfixes → master) leaves next's queued work unshipped, so master is
                  # MERGED into next to preserve it. Guessing "other" (reset) when it was
                  # really a hotfix is a SILENT DATA-LOSS bug — so this fails SAFE: the reset
                  # path runs only when the head ref is POSITIVELY a non-hotfixes branch. An
                  # unreadable / unknown head falls through to the hotfix/preserve (merge)
                  # path, never the reset. The API error is surfaced, not swallowed (a hidden
                  # failure here is exactly what mis-fired every hotfix reset before). (#278)
                  #
                  # The same PR also yields the release PR's head SHA (the tip the
                  # release squash was built from), its number and merge time, which
                  # reset-branch-after-release uses to tell what shipped from what
                  # merged into the branch afterwards (#360).
                  head=""; head_sha=""; pr_number=""; merged_at=""; err=""; pr_fields=""
                  if ! pr_fields=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" \
                              --jq '([.[] | select(.merged_at != null)] | sort_by(.merged_at) | last) // .[0] | select(. != null) | [.head.ref // "", .head.sha // "", (.number // "" | tostring), .merged_at // ""] | join("\u001f")' \
                              2>"$RUNNER_TEMP/gh_err"); then
                      err=$(cat "$RUNNER_TEMP/gh_err" 2>/dev/null || true)
                      pr_fields=""
                  fi
                  # Fields are joined with the ASCII unit separator: a non-whitespace
                  # IFS keeps an empty field in place (tabs would collapse).
                  if [ -n "$pr_fields" ]; then
                      IFS=$'\x1f' read -r head head_sha pr_number merged_at <<< "$pr_fields"
                  fi
                  {
                      echo "head-sha=$head_sha"
                      echo "pr-number=$pr_number"
                      echo "merged-at=$merged_at"
                  } >> "$GITHUB_OUTPUT"
                  echo "released commit $RELEASE_SHA → PR #${pr_number:-?} head ref: ${head:-<unknown>} head sha: ${head_sha:-<unknown>}"
                  [ -n "$err" ] && echo "⚠️ commit→PR lookup failed: $err"
                  if [ "$head" = "hotfixes" ]; then
                      echo "✅ hotfix lane → MERGE master into next (preserve queued work)"
                      echo "lane=hotfix" >> "$GITHUB_OUTPUT"
                  elif [ -n "$head" ]; then
                      echo "✅ normal lane (head=$head) → reset next to master"
                      echo "lane=other" >> "$GITHUB_OUTPUT"
                  else
                      echo "⚠️ lane indeterminate — failing SAFE: MERGE master into next (never reset)"
                      echo "lane=hotfix" >> "$GITHUB_OUTPUT"
                  fi

            - name: Guard — is this repo on v4? (do next/hotfixes exist?)
              id: guard
              shell: bash
              run: |
                  next_exists=false; hotfixes_exists=false
                  if git ls-remote --exit-code --heads origin next >/dev/null 2>&1; then
                      next_exists=true
                      git fetch origin next:refs/remotes/origin/next --quiet || true
                  fi
                  if git ls-remote --exit-code --heads origin hotfixes >/dev/null 2>&1; then
                      hotfixes_exists=true
                      git fetch origin hotfixes:refs/remotes/origin/hotfixes --quiet || true
                  fi
                  # "v4 adopted" = at least one integration branch exists. Keeps the
                  # reset a no-op on pre-cutover repos (neither exists) while letting
                  # it RECREATE a branch that went missing post-cutover (e.g. one was
                  # deleted as a merged PR head). force-reset-branch creates if absent.
                  v4_adopted=false
                  { [ "$next_exists" = true ] || [ "$hotfixes_exists" = true ]; } && v4_adopted=true
                  {
                      echo "next-exists=$next_exists"
                      echo "hotfixes-exists=$hotfixes_exists"
                      echo "v4-adopted=$v4_adopted"
                  } >> "$GITHUB_OUTPUT"
                  echo "ℹ️ next=$next_exists hotfixes=$hotfixes_exists v4-adopted=$v4_adopted lane=${{ steps.lane.outputs.lane }}"

            # hotfixes always tracks master after a release — created if missing.
            # Hotfix PRs that merged into hotfixes after the release PR was cut
            # (or, on a normal release, hotfixes work not yet released) are
            # carried onto the release commit, not dropped (#360).
            - name: Move hotfixes onto the release (carry late merges; create if missing)
              if: steps.guard.outputs.v4-adopted == 'true'
              uses: CLDMV/.github/.github/actions/git/steps/reset-branch-after-release@v4
              with:
                  target-branch: hotfixes
                  release-sha: ${{ github.sha }}
                  release-head-sha: ${{ steps.lane.outputs.head-sha }}
                  release-pr-number: ${{ steps.lane.outputs.pr-number }}
                  release-merged-at: ${{ steps.lane.outputs.merged-at }}
                  github-token: ${{ steps.app-token.outputs.token }}

            # Normal release → next's shipped work is replaced by the release
            # commit; anything that merged into next after the release PR was cut
            # is replayed on top instead of being dropped (#360). Recreated if it
            # was deleted on merge. !cancelled(): runs even if the hotfixes step
            # failed — the two branches are independent.
            - name: Move next onto the release (normal release; carry late merges; create if missing)
              if: ${{ !cancelled() && steps.guard.outputs.v4-adopted == 'true' && steps.lane.outputs.lane != 'hotfix' }}
              uses: CLDMV/.github/.github/actions/git/steps/reset-branch-after-release@v4
              with:
                  target-branch: next
                  release-sha: ${{ github.sha }}
                  release-head-sha: ${{ steps.lane.outputs.head-sha }}
                  release-pr-number: ${{ steps.lane.outputs.pr-number }}
                  release-merged-at: ${{ steps.lane.outputs.merged-at }}
                  github-token: ${{ steps.app-token.outputs.token }}

            # Hotfix release + next still exists → merge master into next to
            # preserve its accumulated feature work (§7.2 option B). When next has
            # a pending release, both sides bumped the package.json /
            # package-lock.json version and the Merges API 409s; the action then
            # merges locally (needs the full-history checkout above), keeps next's
            # version when those version fields are the ONLY conflicts, and
            # publishes the merge commit via the API. Any other conflict fails. (#334)
            - name: Merge master into next (hotfix release; next exists)
              # !cancelled(): runs even if the hotfixes step above failed — the two
              # branches are independent, and next must not be left behind.
              if: ${{ !cancelled() && steps.guard.outputs.v4-adopted == 'true' && steps.lane.outputs.lane == 'hotfix' && steps.guard.outputs.next-exists == 'true' }}
              uses: CLDMV/.github/.github/actions/github/steps/merge-master-into-branch@v4
              with:
                  target-branch: next
                  source-ref: master
                  github-token: ${{ steps.app-token.outputs.token }}

            # Hotfix release but next is MISSING (deleted) → recreate it at master
            # HEAD; there's no accumulated work to preserve.
            - name: Recreate next at master HEAD (hotfix release; next missing)
              if: ${{ !cancelled() && steps.guard.outputs.v4-adopted == 'true' && steps.lane.outputs.lane == 'hotfix' && steps.guard.outputs.next-exists == 'false' }}
              uses: CLDMV/.github/.github/actions/git/steps/force-reset-branch@v4
              with:
                  target-branch: next
                  source-ref: master
                  github-token: ${{ steps.app-token.outputs.token }}
