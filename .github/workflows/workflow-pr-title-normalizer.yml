# Reusable: normalize contributor PR titles to Conventional Commits format,
# derived from the highest-priority commit in the PR. The normalize-pr-title
# action owns ALL skip logic (bot authors, the long-running release PRs, titles
# already starting with `release:`, and titles that already conform).
#
# This owns the job logic so callers stay thin. The `pull_request_target`
# trigger + concurrency live in the CALLER (GitHub requires the trigger to be
# declared locally); everything else is here, so bumping `@v4` carries fixes
# without re-copying job steps into every repo.
#
#   - This repo dogfoods it via local-pr-title-normalizer.yml (`uses: ./…`).
#   - Consumers call it via examples/individual-repo-workflows/release-flow-v4/
#     pr-title-normalizer.yml (`uses: CLDMV/.github/…@v4`).
#
# SECURITY NOTE: callers trigger on pull_request_target (base-repo context,
# write token, secrets). SAFE because this path is API-only — normalize-pr-title
# never checks out the PR head and never executes PR content. Do NOT add a
# checkout step here.
name: 🏷️ PR Title Normalizer (v4 reusable)

on:
    workflow_call:
        inputs:
            runs_on:
                required: false
                type: string
                default: ""
                description: "Runner label for every job in this workflow chain. Empty = auto: resolves the caller's RUNS_ON_DEFAULT Actions variable (org- or repo-level, all trigger types including schedule) when set; otherwise ubuntu-latest."
        secrets:
            BOT_APP_CLIENT_ID:
                description: "GitHub App client id for the bot that edits PR titles."
                required: true
            BOT_APP_PRIVATE_KEY:
                description: "GitHub App private key for the bot."
                required: true

permissions:
    contents: read
    pull-requests: write

jobs:
    normalize:
        name: "✏️ Normalize title"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || 'ubuntu-latest') }}
        steps:
            - name: Create App token (falls back to GITHUB_TOKEN)
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            - name: Normalize PR title
              uses: CLDMV/.github/.github/actions/github/steps/normalize-pr-title@v4
              with:
                  pr-number: ${{ github.event.pull_request.number }}
                  github-token: ${{ steps.app-token.outputs.token }}
                  base-ref: ${{ github.event.pull_request.base.ref }}
                  head-ref: ${{ github.event.pull_request.head.ref }}
                  user-type: ${{ github.event.pull_request.user.type }}
                  user-login: ${{ github.event.pull_request.user.login }}
