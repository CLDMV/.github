# Dependency Review (org-level, reusable).
#
# At PR-time, flags new/changed deps + CVE matches from the GitHub Advisory
# Database. Comments a summary on the PR. Optional license-policy enforcement.
#
# Batch 2.2 from tmp/plan-future-workflows.md.
name: 🔒 Dependency Review (Org-Level)

on:
    workflow_call:
        inputs:
            runs_on:
                required: false
                type: string
                default: ""
                description: "Runner label for every job in this workflow chain. Empty = auto, in order: the caller's RUNS_ON_DEFAULT Actions variable (all trigger types incl. schedule); else CLDMV-owned private callers route to cldmv-runners; else ubuntu-latest."
            fail_on_severity:
                description: "low | moderate | high | critical | none (informational)"
                required: false
                type: string
                default: "moderate"
            comment_summary:
                description: "Post a summary comment on the PR"
                required: false
                type: boolean
                default: true
            base_ref:
                description: "Base ref override; defaults to PR base"
                required: false
                type: string
                default: ""
            head_ref:
                description: "Head ref override; defaults to PR head"
                required: false
                type: string
                default: ""
            allow_licenses:
                description: "Comma-sep SPDX allowlist (mutually exclusive with deny_licenses)"
                required: false
                type: string
                default: ""
            deny_licenses:
                description: "Comma-sep SPDX denylist. Empty default since CLDMV is mixed-license."
                required: false
                type: string
                default: ""
            warn_on_openssf_scorecard_level:
                description: "Warn if a new dep has an OpenSSF Scorecard score below this. 0 = disable."
                required: false
                type: number
                default: 3
        secrets:
            # Optional. When provided, the PR-comment summary is attributed to
            # the consumer's bot App instead of github-actions[bot]. Falls back
            # to GITHUB_TOKEN via create-app-token's auto-detect.
            BOT_APP_CLIENT_ID:
                required: false
            BOT_APP_PRIVATE_KEY:
                required: false

permissions:
    contents: read
    pull-requests: write

jobs:
    review:
        name: "🔒 Dependency Review"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        steps:
            - name: Checkout
              uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4

            # App token so the dependency-review comment is posted as the
            # consumer's bot instead of github-actions[bot]. Auto-falls back
            # to GITHUB_TOKEN when bot secrets are absent, preserving the
            # previous behavior for repos that haven't wired the App yet.
            - name: Create App token (falls back to GITHUB_TOKEN)
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            - name: Review dependencies
              id: depreview
              uses: actions/dependency-review-action@v4.9.0
              with:
                  repo-token: ${{ steps.app-token.outputs.token }}
                  fail-on-severity: ${{ inputs.fail_on_severity }}
                  # We post the comment ourselves (next step) from this action's
                  # structured outputs (vulnerable-changes / invalid-license-changes
                  # / denied-changes / dependency-changes) so each count lists its
                  # actual packages. The action's own PR comment only shows counts
                  # (collapsing to a "View full job summary" link when oversized) —
                  # the uninformative comment we're replacing — so suppress it here.
                  comment-summary-in-pr: never
                  base-ref: ${{ inputs.base_ref }}
                  head-ref: ${{ inputs.head_ref }}
                  allow-licenses: ${{ inputs.allow_licenses }}
                  deny-licenses: ${{ inputs.deny_licenses }}
                  warn-on-openssf-scorecard-level: ${{ inputs.warn_on_openssf_scorecard_level }}

            # Upsert a compact PR comment that lists the actual packages under
            # each count (not just "N packages with …"). Runs on `always()` so a
            # PR blocked by the review still gets the comment (the outputs are set
            # before fail-on-severity throws). `comment_summary: false` opts a
            # repo out of the comment entirely.
            - name: Post dependency-review summary comment
              if: ${{ always() && inputs.comment_summary && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
              uses: actions/github-script@v7
              env:
                  # Structured outputs from the review step — we compose the comment
                  # ourselves so each "N packages with …" count lists its packages
                  # (the action's own comment only shows counts).
                  VULN: ${{ steps.depreview.outputs['vulnerable-changes'] }}
                  LICENSES: ${{ steps.depreview.outputs['invalid-license-changes'] }}
                  DENIED: ${{ steps.depreview.outputs['denied-changes'] }}
                  ALL_CHANGES: ${{ steps.depreview.outputs['dependency-changes'] }}
                  SCORECARD_LEVEL: ${{ inputs.warn_on_openssf_scorecard_level }}
                  ALLOW_LICENSES: ${{ inputs.allow_licenses }}
                  DENY_LICENSES: ${{ inputs.deny_licenses }}
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const marker = "<!-- cldmv:dependency-review -->";
                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
                      const parse = (s) => { try { return JSON.parse(s || "null"); } catch { return null; } };

                      const vuln = parse(process.env.VULN) || [];
                      const lic = parse(process.env.LICENSES) || {};
                      const denied = parse(process.env.DENIED) || [];
                      const all = parse(process.env.ALL_CHANGES) || [];
                      const scLevel = Number(process.env.SCORECARD_LEVEL || "0");
                      // invalid-license-changes = { forbidden(incompatible), unresolved(invalid SPDX), unlicensed(unknown) }
                      const forbidden = lic.forbidden || [];
                      const unresolved = lic.unresolved || [];
                      let unlicensed = lic.unlicensed || [];

                      const pkg = (c) => `\`${c.name}@${c.version}\``;
                      const worstSeverity = (c) => {
                          const rank = ["critical", "high", "moderate", "low"];
                          const sevs = (c.vulnerabilities || []).map((v) => v.severity);
                          return rank.find((s) => sevs.includes(s)) || "unknown";
                      };

                      // OpenSSF Scorecard is NOT a dependency-review output — the action fetches
                      // it internally and flags score < level. Do the same via the Scorecard API
                      // for the added deps that have a GitHub source repo, so we can name them.
                      let scorecard = [];
                      let scorecardCapped = false;
                      if (scLevel > 0) {
                          const seen = new Set();
                          const targets = [];
                          for (const c of all) {
                              if (c.change_type !== "added" || !c.source_repository_url) continue;
                              const m = /github\.com[/:]([^/]+)\/([^/#?]+?)(?:\.git)?\/?$/i.exec(c.source_repository_url);
                              if (!m) continue;
                              const key = `${m[1]}/${m[2]}`.toLowerCase();
                              if (seen.has(key)) continue;
                              seen.add(key);
                              targets.push({ change: c, project: `github.com/${m[1]}/${m[2]}` });
                          }
                          const CAP = 100;
                          scorecardCapped = targets.length > CAP;
                          const list = targets.slice(0, CAP);
                          for (let i = 0; i < list.length; i += 8) {
                              const batch = await Promise.all(
                                  list.slice(i, i + 8).map(async (t) => {
                                      try {
                                          const r = await fetch(`https://api.securityscorecards.dev/projects/${t.project}`, { headers: { accept: "application/json" } });
                                          if (!r.ok) return null;
                                          const j = await r.json();
                                          const score = typeof j.score === "number" ? j.score : null;
                                          return score !== null && score < scLevel ? { change: t.change, score } : null;
                                      } catch {
                                          return null;
                                      }
                                  })
                              );
                              for (const b of batch) if (b) scorecard.push(b);
                          }
                      }

                      // GitHub's dependency graph does NOT surface a license for the
                      // `actions` ecosystem, so ANY action / reusable-workflow reference
                      // (first-party `CLDMV/.github/.github/workflows/*.yml@v4` or a third-party
                      // `owner/action@vX`) comes back license: null and lands in `unlicensed`
                      // even though the repo has a LICENSE. Resolve those ourselves from the
                      // repo's LICENSE at the pinned ref (GET /repos/{o}/{r}/license), then apply
                      // the SAME allow/deny policy the action uses: a resolved license that
                      // violates it moves to the incompatible-licenses bucket, an allowed one
                      // clears, and one we can't resolve stays flagged. Deduped by owner/repo;
                      // concurrency 8, like the scorecard leg.
                      if (unlicensed.length) {
                          const isActions = (c) => /^(actions|githubactions)$/i.test(c.ecosystem || "");
                          const ownerRepoRef = (c) => {
                              let o, r;
                              const m = /github\.com[/:]([^/]+)\/([^/#?]+?)(?:\.git)?(?:[/#?]|$)/i.exec(c.source_repository_url || "");
                              if (m) { o = m[1]; r = m[2]; }
                              else {
                                  const parts = String(c.name || "").split("/");
                                  if (parts.length >= 2) { o = parts[0]; r = parts[1]; }
                              }
                              if (!o || !r) return null;
                              const vm = /^v?(\d+)/.exec(String(c.version || ""));
                              return { owner: o, repo: r, ref: vm ? `v${vm[1]}` : null, key: `${o}/${r}`.toLowerCase() };
                          };
                          const toResolve = new Map();
                          for (const c of unlicensed) {
                              if (!isActions(c)) continue;
                              const t = ownerRepoRef(c);
                              if (t && !toResolve.has(t.key)) toResolve.set(t.key, t);
                          }
                          const resolved = new Map();
                          const tasks = [...toResolve.values()];
                          for (let i = 0; i < tasks.length; i += 8) {
                              await Promise.all(tasks.slice(i, i + 8).map(async (t) => {
                                  const read = async (ref) => {
                                      try {
                                          const args = ref ? { owner: t.owner, repo: t.repo, ref } : { owner: t.owner, repo: t.repo };
                                          const res = await github.request("GET /repos/{owner}/{repo}/license", args);
                                          const spdx = res.data && res.data.license && res.data.license.spdx_id;
                                          return spdx && spdx !== "NOASSERTION" ? spdx : null;
                                      } catch {
                                          return null;
                                      }
                                  };
                                  let spdx = t.ref ? await read(t.ref) : null;
                                  if (!spdx) spdx = await read(null);
                                  resolved.set(t.key, spdx);
                              }));
                          }
                          const norm = (s) => String(s).trim().toLowerCase();
                          const allowSet = new Set((process.env.ALLOW_LICENSES || "").split(",").map(norm).filter(Boolean));
                          const denySet = new Set((process.env.DENY_LICENSES || "").split(",").map(norm).filter(Boolean));
                          // allowlist → only listed SPDX pass; denylist → listed SPDX fail;
                          // neither set (CLDMV default) → everything passes. Mirrors the action.
                          const violates = (spdx) => (allowSet.size ? !allowSet.has(norm(spdx)) : denySet.size ? denySet.has(norm(spdx)) : false);
                          const stillUnknown = [];
                          for (const c of unlicensed) {
                              if (!isActions(c)) { stillUnknown.push(c); continue; }
                              const t = ownerRepoRef(c);
                              const spdx = t ? resolved.get(t.key) : null;
                              if (!spdx) { stillUnknown.push(c); continue; } // couldn't resolve → still unknown
                              if (violates(spdx)) { forbidden.push({ ...c, license: spdx }); continue; } // resolved to a disallowed license
                              // resolved to an allowed license → cleared
                          }
                          unlicensed = stillUnknown;
                      }

                      const CAP_LIST = 50;
                      const listOf = (items, fmt) => {
                          if (!items.length) return "";
                          const shown = items.slice(0, CAP_LIST).map((it) => `  - ${fmt(it)}`);
                          if (items.length > CAP_LIST) shown.push(`  - …and ${items.length - CAP_LIST} more`);
                          return "\n" + shown.join("\n");
                      };
                      const row = (bad, count, label, block) => {
                          const icon = count === 0 ? "✅" : bad ? "❌" : "⚠️";
                          return `- ${icon} **${count}** ${label}${count ? block : ""}`;
                      };

                      const lines = [
                          marker,
                          "## 🔒 Dependency Review",
                          "",
                          row(true, vuln.length, "vulnerable package(s)", listOf(vuln, (c) => `${pkg(c)} — **${worstSeverity(c)}** · ${(c.vulnerabilities || [])[0]?.advisory_ghsa_id || "advisory"}`)),
                          row(true, forbidden.length, "package(s) with incompatible licenses", listOf(forbidden, (c) => `${pkg(c)} — ${c.license || "?"}`)),
                          row(false, unresolved.length, "package(s) with invalid SPDX license definitions", listOf(unresolved, (c) => `${pkg(c)} — ${c.license || "?"}`)),
                          row(false, unlicensed.length, "package(s) with unknown licenses", listOf(unlicensed, (c) => pkg(c))),
                          row(true, denied.length, "denied package(s)", listOf(denied, (c) => `${pkg(c)} — ${c.license || "?"}`))
                      ];
                      if (scLevel > 0) {
                          const label = `package(s) with OpenSSF Scorecard score < ${scLevel}${scorecardCapped ? " (first 100 deps checked)" : ""}`;
                          lines.push(row(false, scorecard.length, label, listOf(scorecard, (s) => `${pkg(s.change)} — score **${s.score}**`)));
                      }
                      lines.push("", `_[Full job summary](${runUrl})_`);
                      const body = lines.join("\n");

                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                      const existing = comments.find((c) => c.body && c.body.includes(marker));
                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                          core.info(`Updated dependency-review comment #${existing.id}`);
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number, body });
                          core.info("Created dependency-review comment");
                      }
