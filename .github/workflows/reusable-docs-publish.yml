# gh-pages docs publisher (org-level, reusable).
# Batch 6.1 from tmp/plan-future-workflows.md.
name: 📖 Docs Publish (Org-Level)

on:
    workflow_call:
        inputs:
            runs_on:
                required: false
                type: string
                default: ""
                description: "Runner label for every job in this workflow chain. Empty = auto, in order: the caller's RUNS_ON_DEFAULT Actions variable (all trigger types incl. schedule); else CLDMV-owned private callers route to cldmv-runners; else ubuntu-latest."
            build_command:
                required: true
                type: string
            output_dir:
                required: true
                type: string
            target_branch:
                required: false
                type: string
                default: "gh-pages"
            cname:
                required: false
                type: string
                default: ""
            include_nojekyll:
                required: false
                type: boolean
                default: true
            package_manager:
                required: false
                type: string
                default: "auto"
            node_version:
                required: false
                type: string
                default: "lts/*"
            commit_message:
                required: false
                type: string
                default: "docs: update docs site"
        secrets:
            BOT_APP_CLIENT_ID:
                required: true
            BOT_APP_PRIVATE_KEY:
                required: true
            TAGGER_NAME:
                required: false
            TAGGER_EMAIL:
                required: false

permissions:
    contents: write

concurrency:
    group: docs-publish-${{ github.repository }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        steps:
            - name: Checkout
              uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4
              with:
                  fetch-depth: 0

            - name: Resolve package manager
              id: pm
              uses: CLDMV/.github/.github/actions/npm/utilities/detect-package-manager@v4
              with:
                  package-manager: ${{ inputs.package_manager }}

            - name: Setup Node
              uses: CLDMV/.github/.github/actions/common/steps/setup-node@v4
              with:
                  node-version: ${{ inputs.node_version }}

            - name: Install
              uses: CLDMV/.github/.github/actions/npm/steps/install-dependencies@v4
              with:
                  package-manager: ${{ steps.pm.outputs.package-manager }}

            - name: Build docs
              shell: bash
              env:
                  PM: ${{ steps.pm.outputs.package-manager }}
                  CMD: ${{ inputs.build_command }}
              run: |
                  cmd="$CMD"
                  if [ "$PM" != "npm" ]; then
                    case "$cmd" in
                      "npm "*) cmd="$PM ${cmd#npm }" ;;
                      "npx "*) cmd="$PM dlx ${cmd#npx }" ;;
                    esac
                  fi
                  echo "▶ $cmd"
                  eval "$cmd"

            - name: Create App token
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            - name: Publish to gh-pages
              uses: CLDMV/.github/.github/actions/common/jobs/publish-gh-pages@v4
              with:
                  output_dir: ${{ inputs.output_dir }}
                  target_branch: ${{ inputs.target_branch }}
                  cname: ${{ inputs.cname }}
                  include_nojekyll: ${{ inputs.include_nojekyll }}
                  commit_message: ${{ inputs.commit_message }}
                  github_token: ${{ steps.app-token.outputs.token }}
              env:
                  TAGGER_NAME: ${{ secrets.TAGGER_NAME }}
                  TAGGER_EMAIL: ${{ secrets.TAGGER_EMAIL }}
