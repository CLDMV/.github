# v4 core: after a release lands on master, re-sync the integration branches
# (docs/conventions/release-flow-v4.md §6.3, §7). Thin caller — all job logic
# lives in workflow-next-reset.yml so bumping it carries fixes without editing
# this file. The `push` trigger to master/main stays here (GitHub requires the
# trigger to be declared locally).
# STATUS: v4.
name: ♻️ Local Next/Hotfixes Reset (v4)

on:
    push:
        branches: [master, main]

concurrency:
    group: local-next-reset-${{ github.repository }}
    cancel-in-progress: false

jobs:
    sync:
        permissions:
            contents: write
        uses: ./.github/workflows/workflow-next-reset.yml
        secrets:
            BOT_APP_CLIENT_ID: ${{ secrets.CLDMV_BOT_APP_CLIENT_ID }}
            BOT_APP_PRIVATE_KEY: ${{ secrets.CLDMV_BOT_APP_PRIVATE_KEY }}
