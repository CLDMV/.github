# CodeQL static-analysis (org-level, reusable).
#
# Wraps github/codeql-action so consumer repos get one version-pinned source
# of truth for query suites, path filters, and language matrix. Marketplace
# action is GitHub-owned; rolling our own would reimplement OpenSSF's research
# output, so we wrap.
#
# Batch 2.1 from tmp/plan-future-workflows.md.
name: 🔍 CodeQL Analysis (Org-Level)

on:
    workflow_call:
        inputs:
            runs_on:
                required: false
                type: string
                default: ""
                description: "Runner label for every job in this workflow chain. Empty = auto, in order: the caller's RUNS_ON_DEFAULT Actions variable (all trigger types incl. schedule); else CLDMV-owned private callers route to cldmv-runners; else ubuntu-latest."
            languages:
                description: "Comma-sep CodeQL languages. Matrix-expanded inside. Examples: javascript-typescript, python, java, go, ruby, csharp, swift, kotlin, cpp."
                required: false
                type: string
                default: "javascript-typescript"
            queries:
                description: "Query suites. 'security-extended' = standard + extra security checks. 'security-and-quality' adds maintainability."
                required: false
                type: string
                default: "security-extended,security-and-quality"
            paths:
                description: "Optional comma-sep paths to limit analysis to (e.g. 'src/')."
                required: false
                type: string
                default: ""
            paths_ignore:
                description: "Paths to exclude. Defaults skip vendored code and test fixtures (which produce noise without value)."
                required: false
                type: string
                default: "node_modules/,dist/,coverage/,build/,**/test/**,**/tests/**,**/__tests__/**"
            config_file:
                description: "Optional path to custom codeql-config.yml in consumer repo. When set, inputs above are ignored."
                required: false
                type: string
                default: ""
            build_mode:
                description: "none = analyze source directly (JS/TS, Python, Ruby). autobuild = CodeQL detects build system. manual = run manual_build_command."
                required: false
                type: string
                default: "none"
            manual_build_command:
                description: "Build command when build_mode == manual."
                required: false
                type: string
                default: ""

permissions:
    security-events: write # upload SARIF results
    contents: read
    actions: read # required for private repos

jobs:
    # GitHub Actions expressions have no `split()` builtin, so we round-trip
    # the comma-sep `languages` input through a small Node action that emits
    # a JSON array. The analyze job then uses `fromJson(needs.setup.outputs.languages)`
    # to drive its matrix.
    setup:
        name: "🧮 Build language matrix"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        outputs:
            languages: ${{ steps.parse.outputs.json }}
        steps:
            - name: Parse languages CSV
              id: parse
              uses: CLDMV/.github/.github/actions/common/utilities/parse-csv-list@v4
              with:
                  csv: ${{ inputs.languages }}

    analyze:
        name: "🔍 Analyze ${{ matrix.language }}"
        needs: setup
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || ((github.repository_owner == 'CLDMV' && github.event.repository.private) && 'cldmv-runners' || 'ubuntu-latest')) }}
        # Repo-variable escape hatch for repos with NO CodeQL-analyzable source
        # (e.g. a declarative VS Code grammar extension: only a TextMate grammar,
        # `main: null`, no JS/TS). There, real CodeQL fails "no source code seen"
        # (exit 32), but simply dropping the workflow leaves the `code_scanning`
        # ruleset rule waiting on results that never arrive — "Merging is blocked
        # — Waiting for Code Scanning results" forever. Setting the repo variable
        # `CLDMV_SKIP_CODE_SCANNING` (any non-empty value) skips analysis and
        # uploads an empty, 0-alert CodeQL SARIF instead, producing a PASSING
        # result that satisfies the rule. A plain `if:`-skip is NOT enough — a
        # skipped job produces no result, so the gate still waits. The decision
        # lives in the repo (survives `org-bootstrap-repo` re-applying the rule).
        env:
            SKIP_CODE_SCANNING: ${{ vars.CLDMV_SKIP_CODE_SCANNING }}
        strategy:
            fail-fast: false
            matrix:
                language: ${{ fromJson(needs.setup.outputs.languages) }}
        steps:
            - name: Checkout
              uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4
              with:
                  fetch-depth: 0

            # `paths` / `paths-ignore` are not direct inputs to codeql-action/init —
            # they belong in a codeql-config.yml referenced via `config-file:`. Write
            # one from our inputs unless the caller already supplied their own.
            # CodeQL requires the config file to live INSIDE the workspace; writing
            # to /tmp fails with "configuration file ... is outside of the workspace".
            - name: Write CodeQL config
              if: ${{ inputs.config_file == '' && env.SKIP_CODE_SCANNING == '' }}
              id: codeql_cfg
              shell: bash
              env:
                  PATHS: ${{ inputs.paths }}
                  PATHS_IGNORE: ${{ inputs.paths_ignore }}
              run: |
                  cfg="${GITHUB_WORKSPACE}/.codeql-config-generated.yml"
                  : > "$cfg"
                  emit_list() {
                      local key="$1" csv="$2"
                      [ -z "$csv" ] && return
                      echo "${key}:" >> "$cfg"
                      IFS=',' read -ra arr <<< "$csv"
                      for p in "${arr[@]}"; do
                          p="${p# }"; p="${p% }"
                          [ -n "$p" ] && echo "  - \"${p}\"" >> "$cfg"
                      done
                  }
                  emit_list paths "$PATHS"
                  emit_list paths-ignore "$PATHS_IGNORE"
                  if [ -s "$cfg" ]; then
                      # Path passed to init must be RELATIVE to the workspace root.
                      echo "path=.codeql-config-generated.yml" >> "$GITHUB_OUTPUT"
                  fi

            - name: Initialize CodeQL
              if: ${{ env.SKIP_CODE_SCANNING == '' }}
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  queries: ${{ inputs.queries }}
                  # Either the caller's config_file or our generated one (may be empty).
                  config-file: ${{ inputs.config_file != '' && inputs.config_file || steps.codeql_cfg.outputs.path }}

            - name: Autobuild
              if: ${{ inputs.build_mode == 'autobuild' && env.SKIP_CODE_SCANNING == '' }}
              uses: github/codeql-action/autobuild@v4

            - name: Manual build
              if: ${{ inputs.build_mode == 'manual' && inputs.manual_build_command != '' && env.SKIP_CODE_SCANNING == '' }}
              shell: bash
              run: ${{ inputs.manual_build_command }}

            - name: Analyze
              if: ${{ env.SKIP_CODE_SCANNING == '' }}
              uses: github/codeql-action/analyze@v4
              with:
                  category: "/language:${{ matrix.language }}"

            # ── Skip path (vars.CLDMV_SKIP_CODE_SCANNING set) ────────────────────
            # No analyzable source: upload an empty, 0-alert CodeQL SARIF under the
            # SAME category the real Analyze uses, so a PASSING code-scanning result
            # exists for this language on both the PR and the base branch (this
            # workflow runs on push-to-default AND PRs), clearing the `code_scanning`
            # ruleset gate. The unconditional Checkout above gives upload-sarif the
            # git ref/commit context it needs.
            #
            # Two hard requirements for the upload to be ACCEPTED (else it 4xxs):
            #   1. The SARIF must have one run with `results: []` — NOT `runs: []`,
            #      which GitHub rejects ("1 item required; only 0 were supplied",
            #      github/codeql-action#390). Below is one run, zero results.
            #   2. CodeQL "default setup" must be DISABLED on the repo — GitHub
            #      rejects advanced-setup SARIF uploads when default setup is on.
            #      This repo uses advanced setup (this workflow), so keep default
            #      setup off wherever CLDMV_SKIP_CODE_SCANNING is used.
            - name: Write empty CodeQL SARIF
              if: ${{ env.SKIP_CODE_SCANNING != '' }}
              shell: bash
              run: |
                  cat > "${GITHUB_WORKSPACE}/empty.sarif" <<'JSON'
                  {
                    "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                    "version": "2.1.0",
                    "runs": [
                      {
                        "tool": { "driver": { "name": "CodeQL", "informationUri": "https://codeql.github.com/", "version": "0.0.0", "rules": [] } },
                        "results": []
                      }
                    ]
                  }
                  JSON

            - name: Upload empty CodeQL SARIF
              if: ${{ env.SKIP_CODE_SCANNING != '' }}
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: empty.sarif
                  category: "/language:${{ matrix.language }}"
