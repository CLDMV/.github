# Build the CLDMV self-hosted runner image (ARC actions-runner + gh) and push it
# to ghcr.io/cldmv/actions-runner. Runs on a GitHub-hosted runner (NOT the
# self-hosted cldmv-runners) so it never depends on the very tooling it installs.
# Fixes the exit-127 gap from #210 durably: the image the scale set pulls is now
# reproducible from source instead of a manual local containerd import.
name: 🏃 Build runner image

on:
    # Publish when the image sources land on the default branch.
    push:
        branches: [master, main]
        paths:
            - "images/actions-runner/**"
            - ".github/workflows/build-runner-image.yml"
    # Weekly rebuild to pick up base-image + gh security updates.
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: build-runner-image
    cancel-in-progress: false

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: Build & push ghcr.io/cldmv/actions-runner
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Build & push
              env:
                  IMAGE: ghcr.io/cldmv/actions-runner
                  GHCR_USER: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                  docker build \
                      -t "$IMAGE:latest" \
                      -t "$IMAGE:${GITHUB_SHA::12}" \
                      images/actions-runner
                  docker push "$IMAGE:latest"
                  docker push "$IMAGE:${GITHUB_SHA::12}"

            # Every build pushes a fresh SHA tag and re-points :latest, so the
            # package accumulates one version per merge + one per weekly
            # rebuild, forever. Keep the newest 10 (the version currently
            # tagged :latest is always among them) and delete the rest.
            # continue-on-error: pruning is auxiliary — a cleanup hiccup must
            # not flag an otherwise-successful image publish as failed.
            - name: Prune old package versions (keep 10)
              continue-on-error: true
              uses: actions/delete-package-versions@v5
              with:
                  package-name: actions-runner
                  package-type: container
                  min-versions-to-keep: 10
                  token: ${{ secrets.GITHUB_TOKEN }}
