# Reusable: maintain the ONE persistent `next → master` release PR.
#
# Called on every push to `next` (contributor PR squash-merges land here).
# Resolves the existing release PR and refreshes it, or creates it the first
# time `next` diverges from master. The release PR batches all accumulated
# feature commits into a single release — that batching is v4's whole point
# (docs/conventions/release-flow-v4.md §5.3, §6.1).
#
# The version bump lives on `next` as a `chore: bump version` commit (pushed by
# create/update-release-pr), carried to master through the squash — §8.1.
#
# This owns the job logic so callers stay thin — the `push`/`workflow_dispatch`
# trigger and the `concurrency` group live in the CALLER (GitHub requires the
# trigger local). The per-repo `package_name` / `build_command` are inputs.
# STATUS: v4.
name: 🚀 Next Release (v4 reusable)

on:
    workflow_call:
        inputs:
            runs_on:
                required: false
                type: string
                default: ""
                description: "Runner label for every job in this workflow chain. Empty = auto: resolves the caller's RUNS_ON_DEFAULT Actions variable (org- or repo-level, all trigger types including schedule) when set; otherwise ubuntu-latest."
            package_name:
                description: "NPM package name (e.g. @cldmv/slothlet). Used by create/update-release-pr for changelog + version resolution."
                required: true
                type: string
            build_command:
                description: "Command to build the package before resolving the release. Defaults to `npm run build:ci`."
                required: false
                type: string
                default: "npm run build:ci"
            default_branch:
                description: "Caller YAML override for the release base branch (the `next → <base>` target). Empty (default) = resolve via the CLDMV_RELEASE_BASE var, then the repo's API default_branch, then `master`."
                required: false
                type: string
                default: ""
        secrets:
            BOT_APP_CLIENT_ID:
                description: "GitHub App client id for the bot that opens/refreshes the release PR."
                required: true
            BOT_APP_PRIVATE_KEY:
                description: "GitHub App private key for the bot."
                required: true
            DISCORD_RELEASE_PR_PUBLIC_WEBHOOK:
                description: "Optional Discord webhook (public) for release-PR version-bump notifications."
                required: false
            DISCORD_RELEASE_PR_PRIVATE_WEBHOOK:
                description: "Optional Discord webhook (private) for release-PR version-bump notifications."
                required: false
            SLACK_RELEASE_PR_PUBLIC_WEBHOOK:
                description: "Optional Slack webhook (public) for release-PR version-bump notifications."
                required: false
            SLACK_RELEASE_PR_PRIVATE_WEBHOOK:
                description: "Optional Slack webhook (private) for release-PR version-bump notifications."
                required: false
            GENERIC_RELEASE_PR_PUBLIC_WEBHOOK:
                description: "Optional generic webhook (public) for release-PR version-bump notifications."
                required: false
            GENERIC_RELEASE_PR_PRIVATE_WEBHOOK:
                description: "Optional generic webhook (private) for release-PR version-bump notifications."
                required: false

permissions:
    contents: write
    pull-requests: write

jobs:
    plan:
        # Loop guard: skip only the release machinery's own `chore: bump version`
        # push (create/update-release-pr writes it back to `next`). Do NOT gate on
        # github.actor — dependabot security PRs are auto-merged BY the bot, and
        # excluding the bot actor meant bot-merged PRs never refreshed the release
        # PR (fatal on `hotfixes`, where every merge is a bot auto-merge). Reset
        # force-pushes are harmless: the detect step below no-ops when in sync with
        # master. workflow_dispatch bypasses the guard (event_name != 'push').
        if: |
            github.event_name != 'push' ||
            !startsWith(github.event.head_commit.message, 'chore: bump version')
        name: "🔍 Plan (detect changes + resolve PR)"
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || 'ubuntu-latest') }}
        outputs:
            has-changes: ${{ steps.detect.outputs.has-changes }}
            pr-number: ${{ steps.resolve.outputs.pr-number }}
            default-branch: ${{ steps.base.outputs.default-branch }}
        steps:
            - name: Create App token
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            - name: Checkout next
              uses: CLDMV/.github/.github/actions/common/steps/checkout-code@v4
              with:
                  ref: next
                  fetch-depth: 0

            # Resolve the release base branch (override var → caller input → API
            # default_branch → master). `vars` in a reusable resolves against the
            # CALLER repo — intended, so a per-repo CLDMV_RELEASE_BASE var works.
            - name: Resolve release base
              id: base
              uses: CLDMV/.github/.github/actions/git/utilities/resolve-release-base@v4
              with:
                  override: ${{ vars.CLDMV_RELEASE_BASE }}
                  configured: ${{ inputs.default_branch }}
                  github-token: ${{ steps.app-token.outputs.token }}

            - name: Detect base..next changes
              id: detect
              shell: bash
              env:
                  BASE: ${{ steps.base.outputs.default-branch }}
              run: |
                  git fetch origin "$BASE" --quiet
                  count=$(git rev-list --count "origin/$BASE..HEAD")
                  echo "📊 commits on next not yet on $BASE: $count"
                  if [ "$count" -gt 0 ]; then
                      echo "has-changes=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "has-changes=false" >> "$GITHUB_OUTPUT"
                      echo "ℹ️ next is in sync with $BASE — nothing to release."
                  fi

            - name: Resolve persistent next→base PR
              id: resolve
              if: steps.detect.outputs.has-changes == 'true'
              shell: bash
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  BASE: ${{ steps.base.outputs.default-branch }}
              run: |
                  # The persistent release PR is the open PR with head=next,
                  # base=$BASE. There is at most one (concurrency-serialized).
                  pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head next --base "$BASE" \
                       --state open --json number --jq '.[0].number // ""')
                  echo "pr-number=$pr" >> "$GITHUB_OUTPUT"
                  if [ -n "$pr" ]; then
                      echo "🔁 existing release PR: #$pr — will refresh"
                  else
                      echo "🆕 no release PR yet — will create"
                  fi

    create:
        name: "🆕 Create release PR"
        needs: plan
        if: needs.plan.outputs.has-changes == 'true' && needs.plan.outputs.pr-number == ''
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || 'ubuntu-latest') }}
        steps:
            - name: Create App token
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            # Runs on the `next` ref → create-release-pr opens next → master and
            # pushes the chore-bump commit to next.
            - name: Create release PR
              uses: CLDMV/.github/.github/actions/github/jobs/create-release-pr@v4
              with:
                  package-name: ${{ inputs.package_name }}
                  build-command: ${{ inputs.build_command }}
                  default-branch: ${{ needs.plan.outputs.default-branch }}
                  github-token: ${{ steps.app-token.outputs.token }}

    refresh:
        name: "🔁 Refresh release PR #${{ needs.plan.outputs.pr-number }}"
        needs: plan
        if: needs.plan.outputs.has-changes == 'true' && needs.plan.outputs.pr-number != ''
        runs-on: ${{ inputs.runs_on != '' && inputs.runs_on || (vars.RUNS_ON_DEFAULT != '' && vars.RUNS_ON_DEFAULT || 'ubuntu-latest') }}
        steps:
            - name: Create App token
              id: app-token
              uses: CLDMV/.github/.github/actions/github/steps/create-app-token@v4
              with:
                  client_id: ${{ secrets.BOT_APP_CLIENT_ID }}
                  private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
              env:
                  BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
                  BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

            - name: Refresh release PR
              id: refresh
              uses: CLDMV/.github/.github/actions/github/jobs/update-release-pr@v4
              with:
                  head-ref: next
                  pr-number: ${{ needs.plan.outputs.pr-number }}
                  package-name: ${{ inputs.package_name }}
                  build-command: ${{ inputs.build_command }}
                  default-branch: ${{ needs.plan.outputs.default-branch }}
                  github-token: ${{ steps.app-token.outputs.token }}

            # Release-PR notifier — fires only when the target version actually
            # changed (PR open or version-bump shift), never on the changelog-
            # only refreshes that run for every commit on `next`. Each secret
            # is independently opt-in: unset = no-op.
            - name: Notify on release-PR version bump
              if: steps.refresh.outputs.version-changed == 'true'
              uses: CLDMV/.github/.github/actions/community/jobs/release-notifier@v4
              with:
                  event_kind: release_pr
                  pr_number: ${{ needs.plan.outputs.pr-number }}
                  version: ${{ steps.refresh.outputs.new-version }}
                  github_token: ${{ steps.app-token.outputs.token }}
              env:
                  DISCORD_RELEASE_PR_PUBLIC_WEBHOOK: ${{ secrets.DISCORD_RELEASE_PR_PUBLIC_WEBHOOK }}
                  DISCORD_RELEASE_PR_PRIVATE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_PR_PRIVATE_WEBHOOK }}
                  SLACK_RELEASE_PR_PUBLIC_WEBHOOK: ${{ secrets.SLACK_RELEASE_PR_PUBLIC_WEBHOOK }}
                  SLACK_RELEASE_PR_PRIVATE_WEBHOOK: ${{ secrets.SLACK_RELEASE_PR_PRIVATE_WEBHOOK }}
                  GENERIC_RELEASE_PR_PUBLIC_WEBHOOK: ${{ secrets.GENERIC_RELEASE_PR_PUBLIC_WEBHOOK }}
                  GENERIC_RELEASE_PR_PRIVATE_WEBHOOK: ${{ secrets.GENERIC_RELEASE_PR_PRIVATE_WEBHOOK }}
