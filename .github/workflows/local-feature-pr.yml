# Local dogfood for THIS repo (CLDMV/.github) — auto-opens (and refreshes) a PR
# from a code-side branch to the right v4 integration branch on every push. Thin
# caller — all job logic lives in workflow-feature-pr.yml so bumping it carries
# fixes without editing this file. The `push` trigger and its branch-prefix list
# stay here (GitHub requires the trigger local, and the list is per-repo config).
#
# Mapping (matches docs/conventions/branch-naming.md allowed patterns):
#   feat/*, feature/*, fix/*, release/*, chore/*, refactor/*,
#   docs/*, ci/*, perf/*, test/*, style/*           → next
#   hotfix/*                                         → hotfixes
#
# Reserved branches NOT auto-PR'd: dependabot/* and copilot/* (they manage their
# own PRs); badges, gh-pages (bot-only); master/main (the target).
name: 🔀 Local Feature PR (v4)

on:
    push:
        branches:
            # CUSTOMIZE: prune this list to whichever branch prefixes your
            # repo uses. Must align with the `case` statement in the reusable.
            - 'feat/**'
            - 'feature/**'
            - 'fix/**'
            - 'release/**'
            - 'chore/**'
            - 'refactor/**'
            - 'docs/**'
            - 'ci/**'
            - 'perf/**'
            - 'test/**'
            - 'style/**'
            - 'hotfix/**'

concurrency:
    group: feature-pr-${{ github.repository }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    open-pr:
        permissions:
            contents: read
            pull-requests: write
        uses: ./.github/workflows/workflow-feature-pr.yml
        secrets:
            BOT_APP_CLIENT_ID: ${{ secrets.CLDMV_BOT_APP_CLIENT_ID }}
            BOT_APP_PRIVATE_KEY: ${{ secrets.CLDMV_BOT_APP_PRIVATE_KEY }}
